<script>

/* =========================================================
   基础数据
========================================================= */

const STORAGE_KEY = "wangxing_api_key";
const MODEL_KEY = "wangxing_model";
const HISTORY_KEY = "wangxing_history";

let state = {
    question: "",
    lines: [],
    currentLine: 0,
    currentChange: 0,
    currentSticks: 49,
    firstChangeDone: false,
    finished: false,
    startTime: null
};


/* =========================================================
   八卦 / 六十四卦
========================================================= */

const trigramNames = {
    "111":"乾",
    "110":"兑",
    "101":"离",
    "100":"震",
    "011":"巽",
    "010":"坎",
    "001":"艮",

};

const hexagrams = {

"010111":["需","水天需"],
"010110":["节","水泽节"],
"010101":["既济","水火既济"],
"010100":["屯","水雷屯"],
"010011":["井","水风井"],
"010010":["坎","坎为水"],
"010001":["蹇","水山蹇"],
"010000":["比","水地比"],

"001111":["大畜","山天大畜"],
"001110":["损","山泽损"],
"001101":["贲","山火贲"],
"001100":["颐","山雷颐"],
"001011":["蛊","山风蛊"],
"001010":["蒙","山水蒙"],
"001001":["艮","艮为山"],
"001000":["剥","山地剥"],

"000111":["泰","地天泰"],
"000110":["临","地泽临"],
"000101":["明夷","地火明夷"],
"000100":["复","地雷复"],
"000011":["升","地风升"],
"000010":["师","地水师"],
"000001":["谦","地山谦"],
"000000":["坤","坤为地"]
};


/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const questionInput = $("question");
const startBtn = $("startBtn");
const newBtn = $("newBtn");

const divinationCard = $("divinationCard");
const resultCard = $("resultCard");
const aiCard = $("aiCard");

const linesEl = $("lines");
const drawBtn = $("drawBtn");
const selectionEl = $("selection");
const takeLeft = $("takeLeft");
const takeRight = $("takeRight");

const currentInstruction = $("currentInstruction");

const originalName = $("originalName");
const changedName = $("changedName");
const changingLines = $("changingLines");
const divinationTime = $("divinationTime");

const bigHexagramName = $("bigHexagramName");
const hexagramInfo = $("hexagramInfo");
const hexagramLines = $("hexagramLines");

const aiBtn = $("aiBtn");
const aiStatus = $("aiStatus");
const aiOutput = $("aiOutput");
const aiProgress = $("aiProgress");

const apiKeyInput = $("apiKey");
const modelSelect = $("model");

const historyEl = $("history");


/* =========================================================
   初始化
========================================================= */

function init(){

    const savedKey = localStorage.getItem(STORAGE_KEY);
    const savedModel = localStorage.getItem(MODEL_KEY);

    if(savedKey){
        apiKeyInput.value = savedKey;
    }

    if(savedModel){
        modelSelect.value = savedModel;
    }

    renderHistory();
}

init();


/* =========================================================
   状态
========================================================= */

function setStatus(text,type=""){
    const el = $("mainStatus");

    el.className = "status " + type;
    el.textContent = text;
    el.classList.remove("hidden");
}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}


/* =========================================================
   开始起卦
========================================================= */

startBtn.addEventListener("click",()=>{

    const question = questionInput.value.trim();

    if(!question){
        setStatus("请先写下你想问的问题。","error");
        questionInput.focus();
        return;
    }

    state = {
        question,
        lines: [],
        currentLine: 0,
        currentChange: 0,
        currentSticks: 49,
        firstChangeDone: false,
        finished: false,
        startTime: new Date().toISOString()
    };

    divinationCard.classList.remove("hidden");
    resultCard.classList.add("hidden");
    aiCard.classList.add("hidden");

    setStatus("问题已确定。现在开始大衍筮法起卦。","success");

    renderLines();

    currentInstruction.textContent =
        "第一爻 · 第一变：请开始分二。";

    drawBtn.textContent = "开始第一变";

    drawBtn.disabled = false;

    selectionEl.classList.add("hidden");

    divinationCard.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
});


/* =========================================================
   新开始
========================================================= */

newBtn.addEventListener("click",()=>{

    state = {
        question:"",
        lines:[],
        currentLine:0,
        currentChange:0,
        currentSticks:49,
        firstChangeDone:false,
        finished:false,
        startTime:null
    };

    questionInput.value="";

    divinationCard.classList.add("hidden");
    resultCard.classList.add("hidden");
    aiCard.classList.add("hidden");

    $("mainStatus").classList.add("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
});


/* =========================================================
   六爻显示
========================================================= */

function renderLines(){

    linesEl.innerHTML="";

    for(let i=5;i>=0;i--){

        const line = state.lines[i];

        const box = document.createElement("div");
        box.className="line";

        const head = document.createElement("div");
        head.className="line-head";

        const title = document.createElement("div");
        title.className="line-number";
        title.textContent =
            `${i+1}爻 ${i===0?"初爻":i===5?"上爻":""}`;

        const result = document.createElement("div");
        result.className="line-result";

        if(!line){
            result.textContent="未完成";
        }else{
            result.textContent =
                line.total +
                " · " +
                line.type;
        }

        head.appendChild(title);
        head.appendChild(result);

        box.appendChild(head);

        if(line){

            const info = document.createElement("div");
            info.className="yin-yang";

            info.innerHTML =
                `三变结果：${line.changes.join(" → ")}
                ｜ ${line.changing ? '<span class="changing">动爻</span>' : '静爻'}`;

            box.appendChild(info);

            const steps = document.createElement("div");
            steps.className="steps";

            line.changes.forEach((v,index)=>{

                const step=document.createElement("div");

                step.className="step done";

                step.textContent =
                    `第${index+1}变：${v}`;

                steps.appendChild(step);
            });

            box.appendChild(steps);
        }

        linesEl.appendChild(box);
    }
}


/* =========================================================
   大衍筮法
========================================================= */

drawBtn.addEventListener("click",()=>{

    if(state.finished) return;

    startChange();
});


function startChange(){

    drawBtn.disabled=true;
    selectionEl.classList.add("hidden");

    currentInstruction.textContent =
        `第${state.currentLine+1}爻 · 第${state.currentChange+1}变：正在进行分二。`;

    /*
       这里模拟“分二”。
       实际点击左右取哪边，由用户决定。
    */

    setTimeout(()=>{

        currentInstruction.textContent =
            "请选择从哪一边取。";

        selectionEl.classList.remove("hidden");

    },350);
}


/* =========================================================
   左右取
========================================================= */

takeLeft.addEventListener("click",()=>chooseSide("左"));
takeRight.addEventListener("click",()=>chooseSide("右"));


function chooseSide(side){

    selectionEl.classList.add("hidden");

    const randomPart =
        Math.floor(Math.random()*24)+1;

    const remainder =
        4 + Math.floor(Math.random()*4);

    const result =
        randomPart + remainder;

    finishChange(result,side);
}


/* =========================================================
   完成本变
========================================================= */

function finishChange(result,side){

    if(!state.lines[state.currentLine]){

        state.lines[state.currentLine]={
            changes:[],
            sides:[],
            total:0,
            type:"",
            changing:false
        };
    }

    const line = state.lines[state.currentLine];

    line.changes.push(result);
    line.sides.push(side);

    line.total += result;

    renderLines();

    state.currentChange++;

    /*
       第三变完成：
       自动记录这一爻
       不再需要用户点击“完成这一爻”
    */

    if(state.currentChange>=3){

        finalizeLine();

        return;
    }

    drawBtn.disabled=false;

    currentInstruction.textContent =
        `第${state.currentLine+1}爻 · 第${state.currentChange+1}变`;

    drawBtn.textContent =
        `开始第${state.currentChange+1}变`;
}


/* =========================================================
   完成一爻
========================================================= */

function finalizeLine(){

    const line = state.lines[state.currentLine];

    /*
       使用三变结果决定爻：
       6 老阴
       7 少阳
       8 少阴
       9 老阳
    */

    const normalized =
        line.changes.reduce((a,b)=>a+b,0) % 4;

    let value;

    if(normalized===0){
        value=6;
    }else if(normalized===1){
        value=7;
    }else if(normalized===2){
        value=8;
    }else{
        value=9;
    }

    line.value=value;

    if(value===6){
        line.type="老阴";
        line.changing=true;
    }else if(value===7){
        line.type="少阳";
        line.changing=false;
    }else if(value===8){
        line.type="少阴";
        line.changing=false;
    }else{
        line.type="老阳";
        line.changing=true;
    }

    renderLines();

    /*
       自动进入下一爻
    */

    if(state.currentLine>=5){

        state.finished=true;

        currentInstruction.textContent =
            "六爻已完成，正在自动生成卦象……";

        drawBtn.disabled=true;

        setTimeout(()=>{
            buildHexagram();
        },600);

        return;
    }

    state.currentLine++;
    state.currentChange=0;

    currentInstruction.textContent =
        `第${state.currentLine+1}爻 · 第一变`;

    drawBtn.textContent="开始第一变";

    drawBtn.disabled=false;
}


/* =========================================================
   成卦
========================================================= */

function buildHexagram(){

    const originalBits =
        state.lines
            .map(line=>{
                return line.value===7 || line.value===9 ? "1":"0";
            })
            .join("");

    const changedBits =
        state.lines
            .map(line=>{
                if(line.value===6) return "1";
                if(line.value===9) return "0";

                return line.value===7 ? "1":"0";
            })
            .join("");

    const original =
        hexagrams[originalBits] ||
        ["未知","未知卦"];

    const changed =
        hexagrams[changedBits] ||
        ["未知","未知卦"];

    const moving =
        state.lines
            .map((line,index)=>{
                return line.changing ? index+1:null;
            })
            .filter(Boolean);

    originalName.textContent =
        original[1];

    changedName.textContent =
        changed[1];

    changingLines.textContent =
        moving.length
        ? moving.join("、")+"爻"
        : "无动爻";

    const time =
        new Date(state.startTime);

    divinationTime.textContent =
        formatDate(time);

    bigHexagramName.textContent =
        original[1];

    hexagramInfo.textContent =
        `本卦：${original[0]} ｜ 变卦：${changed[1]}`;

    renderHexagramLines();

    resultCard.classList.remove("hidden");

    saveHistory();

    setStatus(
        "六爻完成，本卦、变卦和动爻已经生成。",
        "success"
    );

    resultCard.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}


/* =========================================================
   卦画
========================================================= */

function renderHexagramLines(){

    hexagramLines.innerHTML="";

    for(let i=5;i>=0;i--){

        const line =
            state.lines[i];

        const row =
            document.createElement("div");

        row.className =
            "hex-line " +
            (line.changing ? "changing":"");

        const a =
            document.createElement("span");

        const b =
            document.createElement("span");

        if(line.value===6 || line.value===8){

            row.appendChild(a);
            row.appendChild(b);

        }else{

            row.appendChild(a);
            row.appendChild(b);

        }

        hexagramLines.appendChild(row);
    }
}

/* =========================================================
   自动重试核心
========================================================= */

async function requestAIWithRetry(apiKey){

    /*
       三次机会：
       第一次正常请求
       第二次等待后重试
       第三次再次重试

       每次 timeout 45 秒。
    */

    const maxRetries=3;

    let lastError=null;

    for(let attempt=1;attempt<=maxRetries;attempt++){

        try{

            aiStatus.className=
                "status loading";

            if(attempt===1){

                aiStatus.textContent=
                    "正在连接 AI，正在分析卦象……";

            }else{

                aiStatus.textContent=
                    `AI 响应较慢，正在自动重新连接（${attempt}/${maxRetries}）……`;
            }

            const result =
                await requestAI(
                    apiKey,
                    attempt
                );

            return result;

        }catch(error){

            lastError=error;

            if(attempt<maxRetries){

                aiStatus.textContent=
                    `本次连接没有及时返回，${attempt+1} 秒后自动重试……`;

                await sleep(
                    attempt===1 ? 2000 : 4000
                );
            }
        }
    }

    throw lastError;
}


/* =========================================================
   单次 API 请求
========================================================= */

async function requestAI(apiKey,attempt){

    const controller =
        new AbortController();

    /*
       不再使用 10 秒这种过短时间。
       AI 长文本解读给 60 秒。
    */

    const timeout =
        setTimeout(()=>{
            controller.abort();
        },60000);


    const prompt =
buildPrompt();


    try{

        const response =
            await fetch(
                "https://api.openai.com/v1/responses",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer "+apiKey
                    },

                    body:JSON.stringify({

                        model:
                            modelSelect.value,

                        input:
                            prompt,

                        max_output_tokens:
                            4000
                    }),

                    signal:
                        controller.signal
                }
            );


        clearTimeout(timeout);


        /*
           不要把所有 HTTP 错误都显示成 Failed to fetch。
        */

        if(!response.ok){

            let message="";

            try{

                const data =
                    await response.json();

                message =
                    data?.error?.message ||
                    "";

            }catch(e){}

            const error =
                new Error(
                    message ||
                    `API 请求失败（HTTP ${response.status}）`
                );

            error.status =
                response.status;

            throw error;
        }


        const data =
            await response.json();


        /*
           Responses API 通常提供 output_text。
        */

        if(data.output_text){

            return data.output_text.trim();
        }


        /*
           兼容不同返回结构。
        */

        let text="";

        if(Array.isArray(data.output)){

            for(const item of data.output){

                if(!Array.isArray(item.content))
                    continue;

                for(const content of item.content){

                    if(
                        content.type==="output_text" &&
                        content.text
                    ){

                        text +=
                            content.text;
                    }
                }
            }
        }


        if(!text.trim()){

            throw new Error(
                "AI 返回了空结果，请稍后重试。"
            );
        }


        return text.trim();

    }catch(error){

        clearTimeout(timeout);

        throw error;
    }
}


/* =========================================================
   AI Prompt
========================================================= */

function buildPrompt(){

    const original =
        originalName.textContent;

    const changed =
        changedName.textContent;

    const moving =
        changingLines.textContent;


    const lines =
        state.lines
            .map((line,index)=>{

                return `${index+1}爻：${line.type}（${line.value}），三变：${line.changes.join(" → ")}，取：${line.sides.join(" → ")}`;

            })
            .join("\n");


    return `
你是一名严格按照传统易学卦理进行分析的占卜解读者。

请围绕用户提出的“具体问题”进行解读。

不要泛泛谈人生。
不要主动改变问题。
不要把占卜解读变成心理咨询。
不要大量给建议。
用户问的是预测，就直接回答预测结果。
如果卦象只能判断趋势，就明确说明趋势，而不要假装能够确定具体事实。

【用户的问题】
${state.question}

【本卦】
${original}

【变卦】
${changed}

【动爻】
${moving}

【六爻数据】
${lines}

请按照以下结构回答：

一、直接结论
第一段直接回答用户的问题。
明确给出：
- 有利 / 不利
- 能 / 不能
- 会 / 不会
- 当前趋势如何
- 如果涉及时间，判断大致时间窗口

二、卦象依据
结合本卦、变卦、动爻解释为什么得到这个结论。

三、动爻重点
逐个解释本次动爻与用户问题的直接关系。
没有动爻则说明无动爻。

四、事情发展趋势
只讨论用户所问的这件事情。
按照“当前 → 中段 → 后续”的方式说明趋势。

五、最终判断
用简洁的一段话再次回答用户最初的问题。

重要要求：
1. 必须围绕用户的问题。
2. 不要扩展到用户没有询问的恋爱、健康、财运等其他领域。
3. 不要用“建议你”“你应该”作为主要内容。
4. 不要把预测问题回答成行动建议。
5. 如果结果偏向否定，要直接说清楚。
6. 如果存在变数，要说明变数来自哪里。
7. 语言自然、具体，不要堆砌易学术语。
`;
}


/* =========================================================
   错误转换
========================================================= */

function getReadableError(error){

    if(!error){

        return "AI 解读失败，请稍后再试。";
    }

    if(error.name==="AbortError"){

        return "AI 响应超过 60 秒，连续自动重试后仍未返回。";
    }

    const status =
        error.status;

    if(status===401){

        return "API Key 无效或已失效，请检查 API Key。";
    }

    if(status===403){

        return "API Key 没有权限调用当前模型。";
    }

    if(status===429){

        return "API 请求过于频繁或额度不足，请稍后再试。";
    }

    if(status>=500){

        return "AI 服务暂时没有正常响应，系统已经自动重试 3 次，请稍后再试。";
    }

    if(
        error.message &&
        (
            error.message.includes("Failed to fetch") ||
            error.message.includes("NetworkError")
        )
    ){

        return "网络连接没有正常完成。系统已经自动重试 3 次；如果仍失败，请检查当前网络或 API 服务连接。";
    }

    return error.message ||
        "AI 解读失败，请稍后再试。";
}

function saveHistory(){

    const history =
        JSON.parse(
            localStorage.getItem(HISTORY_KEY) ||
            "[]"

    const original =
        originalName.textContent;

    const changed =
        changedName.textContent;


    const record={

            Date.now(),

        question:
            state.question,

        original,

        changed,

        moving:
            changingLines.textContent,

        lines:
            state.lines.map(line=>({

                value:line.value,

                type:line.type,

                changing:line.changing,

                changes:line.changes,

                sides:line.sides

            })),

        time:
            state.startTime
    };


    history.unshift(record);


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history.slice(0,50)
        )
    );


    renderHistory();
}

/* =========================================================
   时间
========================================================= */

function formatDate(date){

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const d =
        String(
            date.getDate()
        ).padStart(2,"0");

    const h =
        String(
            date.getHours()
        ).padStart(2,"0");

    const min =
        String(
            date.getMinutes()
        ).padStart(2,"0");

    const s =
        String(
            date.getSeconds()
        ).padStart(2,"0");

    return `${y}-${m}-${d} ${h}:${min}:${s}`;
}
