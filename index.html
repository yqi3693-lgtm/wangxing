<script>

/* =========================
   星空背景
========================= */

const stars =
document.getElementById("stars");

const ctx =
stars.getContext("2d");

let starList = [];

function resizeStars(){

    stars.width =
        window.innerWidth *
        devicePixelRatio;

    stars.height =
        window.innerHeight *
        devicePixelRatio;

    ctx.scale(
        devicePixelRatio,
        devicePixelRatio
    );

    starList = [];

    const count =
        Math.floor(
            window.innerWidth *
            window.innerHeight /
            9000
        );

    for(let i=0;i<count;i++){

        starList.push({

            x:Math.random()*window.innerWidth,

            y:Math.random()*window.innerHeight,

            r:Math.random()*1.2+.2,

            a:Math.random()*.8+.2

        });

    }
}

function drawStars(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for(const s of starList){

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(180,255,255,${s.a})`;

        ctx.fill();

    }

    requestAnimationFrame(drawStars);
}

window.addEventListener(
    "resize",
    resizeStars
);

resizeStars();
drawStars();

/* =========================
   通过六爻计算卦名
========================= */

function getHexName(lines){

    const lowerBits =
        lines
            .slice(0,3)
            .map(v =>
                (v===7 || v===9) ? "1" : "0"
            )
            .reverse()
            .join("");

    const upperBits =
        lines
            .slice(3,6)
            .map(v =>
                (v===7 || v===9) ? "1" : "0"
            )
            .reverse()
            .join("");

    const lower =
        trigramName[lowerBits];

    const upper =
        trigramName[upperBits];

    return (
        hexagrams[
            upper + lower
        ] ||
        "未知卦"
    );
}


/* =========================
   显示卦象
========================= */

function renderHex(
    target,
    lines
){

    target.innerHTML = "";

    for(
        let i=5;
        i>=0;
        i--
    ){

        const value =
            lines[i];

        const div =
            document.createElement("div");

        div.className =
            "line";

        if(
            value === 6 ||
            value === 9
        ){

            div.classList.add(
                "movingline"
            );

        }

        if(
            value === 7 ||
            value === 9
        ){

            div.innerHTML =
                `<div class="solid"></div>`;

        }else{

            div.innerHTML =
                `
                <div class="broken1"></div>
                <div class="broken2"></div>
                `;

        }

        target.appendChild(div);

    }
}

        alert(
            "请先输入你想占卜的问题。"
        );

        q.focus();

        return;
    }

    yaoIndex = 0;

    allYao = [];

    resetYaoUI();

    begin.disabled = true;

    ai.disabled = true;

    status.textContent =
        "正在进行大衍筮法。";

    startYao();

}


/* =========================
   开始一爻
========================= */

function startYao(){

    currentYao = [];

    stalks = 49;

    changeIndex = 0;

    stageTitle.textContent =
        `第 ${yaoIndex + 1} 爻`;

    stageDesc.textContent =
        "49根蓍草进入第一变。请先分二。";

    piles.innerHTML = "";

    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";

    result.style.display =
        "none";

    renderSplit();

}


/* =========================
   分二
========================= */

function renderSplit(){

    const min = 1;

    const max = 48;

    const left =
        Math.floor(
            Math.random() *
            (max-min+1)
        ) + min;

    const right =
        stalks - left;

    piles.innerHTML = `

        <div class="pile-row">

            <div
                class="pile clickable"
                data-side="left"
                data-left="${left}"
                data-right="${right}"
            >

                <div class="pile-title">
                    左手
                </div>

                <div class="pile-number">
                    ${left}
                </div>

                <div class="pile-hint">
                    点击选择左手分二
                </div>

            </div>


            <div
                class="pile clickable"
                data-side="right"
                data-left="${left}"
                data-right="${right}"
            >

                <div class="pile-title">
                    右手
                </div>

                <div class="pile-number">
                    ${right}
                </div>

                <div class="pile-hint">
                    点击选择右手分二
                </div>

            </div>

        </div>

    `;

    document
        .querySelectorAll(".pile")
        .forEach(el => {

            el.addEventListener(
                "click",
                () => {

                    showHangOne(
                        left,
                        right
                    );

                }
            );

        });

}


/* =========================
   挂一
========================= */

function showHangOne(
    left,
    right
){

    stageDesc.textContent =
        "选择哪一边取一蓍挂一。";

    choice.innerHTML = `

        <div class="choice-title">
            请选择挂一的一蓍
        </div>

        <div class="choice-buttons">

            <button
                class="choice-btn"
                id="hangLeft"
            >
                从左手取一
            </button>

            <button
                class="choice-btn"
                id="hangRight"
            >
                从右手取一
            </button>

        </div>

    `;

    document
        .getElementById("hangLeft")
        .onclick = () => {

            performChange(
                left - 1,
                right
            );

        };

    document
        .getElementById("hangRight")
        .onclick = () => {

            performChange(
                left,
                right - 1
            );

        };

}


/* =========================
   揲四
========================= */

function remainder4(n){

    const r =
        n % 4;

    return r === 0 ? 4 : r;
}


function performChange(
    left,
    right
){

    const leftRemainder =
        remainder4(left);

    const rightRemainder =
        remainder4(right);

    const removed =
        leftRemainder +
        rightRemainder +
        1;

    const remaining =
        stalks -
        removed;

    counts.innerHTML = `

        <div class="countbox">

            左手余数

            <strong>
                ${leftRemainder}
            </strong>

        </div>

        <div class="countbox">

            右手余数

            <strong>
                ${rightRemainder}
            </strong>

        </div>

    `;

    remainders.innerHTML = `

        <div class="r">
            挂一：<b>1</b>
        </div>

        <div class="r">
            左余：<b>${leftRemainder}</b>
        </div>

        <div class="r">
            右余：<b>${rightRemainder}</b>
        </div>

        <div class="r">
            本变余数：<b>${removed}</b>
        </div>

    `;

    stalks =
        remaining;

    changeIndex++;

    stageTitle.textContent =
        `第 ${yaoIndex + 1} 爻 · 第 ${changeIndex} 变`;

    if(changeIndex < 3){

        stageDesc.textContent =
            `本变后余 ${stalks} 策。进入下一变。`;

        choice.innerHTML = `
            <div class="choice-title">
                下一变重新分二
            </div>

            <div class="choice-buttons">

                <button
                    class="choice-btn"
                    id="nextChange"
                >
                    继续下一变
                </button>

            </div>
        `;

        document
            .getElementById("nextChange")
            .onclick = () => {

                renderSplit();

            };

        return;
    }


    /* =========================
       三变完成
    ========================= */

    const yaoNumber =
        stalks / 4;

    currentYao.push(
        yaoNumber
    );

    result.style.display =
        "block";

    result.innerHTML = `

        <div class="num">
            ${yaoNumber}
        </div>

        <div class="name">
            ${getYaoState(yaoNumber)}
        </div>

    `;

    stageDesc.textContent =
        `第 ${yaoIndex + 1} 爻完成。`;

    choice.innerHTML = `
        <div class="choice-buttons">

            <button
                class="choice-btn"
                id="finishYao"
            >
                完成这一爻
            </button>

        </div>
    `;

    document
        .getElementById("finishYao")
        .onclick = finishYao;

}


/* =========================
   爻状态
========================= */

function getYaoState(v){

    if(v === 6)
        return "老阴 · 动";

    if(v === 7)
        return "少阳 · 静";

    if(v === 8)
        return "少阴 · 静";

    if(v === 9)
        return "老阳 · 动";

    return "未知";

}


/* =========================
   完成一爻
========================= */

function finishYao(){

    allYao =
        currentYao.slice();

    updateRows();

    yaoIndex++;

    updateProgress();

    if(yaoIndex >= 6){

        finishHexagram();

        return;
    }

    startYao();

}


/* =========================
   六爻完成
========================= */

function finishHexagram(){

    begin.disabled = false;

    ai.disabled = false;

    stageTitle.textContent =
        "六爻成卦";

    stageDesc.textContent =
        "六爻已经完成，本卦与变卦已经生成。";

    bar.style.width =
        "100%";

    choice.innerHTML =
        "";

    piles.innerHTML =
        "";

    counts.innerHTML =
        "";

    remainders.innerHTML =
        "";

    const original =
        allYao.slice();

    const changed =
        allYao.map(v => {

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        });

    const benName =
        getHexName(original);

    const changeName =
        getHexName(changed);

    bn.textContent =
        `本卦 · ${benName}`;

    cn.textContent =
        `变卦 · ${changeName}`;

    renderHex(
        bh,
        original
    );

    renderHex(
        ch,
        changed
    );

    status.textContent =
        "六爻完成，可以进行 AI 解读。";

    answer.textContent =
        "";

}


/* =========================
   六爻表格
========================= */

function updateRows(){

    rows.innerHTML = "";

    allYao.forEach(
        (value,index) => {

            let symbol;

            if(
                value === 7 ||
                value === 9
            ){

                symbol =
                    "━━━";

            }else{

                symbol =
                    "━ ━";

            }

            const move =
                value === 6 ||
                value === 9;

            const div =
                document.createElement("div");

            div.className =
                "tr" +
                (move ? " move" : "");

            div.innerHTML = `

                <div>
                    第${index+1}爻
                </div>

                <div>
                    ${symbol}
                </div>

                <div>
                    ${value}
                </div>

                <div>
                    ${getYaoState(value)}
                </div>

            `;

            rows.appendChild(div);

        }
    );

}


/* =========================
   重置
========================= */

function resetAll(){

    yaoIndex = 0;

    changeIndex = 0;

    stalks = 49;

    currentYao = [];

    allYao = [];

    question = "";

    q.value = "";

    begin.disabled = false;

    ai.disabled = true;

    stageTitle.textContent =
        "准备大衍之数";

    stageDesc.textContent =
        "五十根蓍草，虚一不用，以四十九根进入本次筮法。";

    bar.style.width =
        "0%";

    piles.innerHTML =
        "";

    choice.innerHTML =
        "";

    counts.innerHTML =
        "";

    remainders.innerHTML =
        "";

    result.style.display =
        "none";

    rows.innerHTML =
        "";

    bh.innerHTML =
        "";

    ch.innerHTML =
        "";

    bn.textContent =
        "本卦";

    cn.textContent =
        "变卦";

    answer.textContent =
        "";

    status.textContent =
        "完成六爻后才能进行 AI 解读。";

}


/* =========================
   API Key
========================= */

document
    .getElementById("keyButton")
    .onclick = () => {

        keyBox.style.display =
            keyBox.style.display === "block"
            ? "none"
            : "block";

    };


document
    .getElementById("saveKey")
    .onclick = () => {

        const value =
            key.value.trim();

        if(!value){

            alert(
                "请输入 DeepSeek API Key"
            );

            return;
        }

        localStorage.setItem(
            "wangxing_deepseek_key",
            value
        );

        const saved =
            localStorage.getItem(
                "wangxing_deepseek_key"
            );

        if(!saved){

            alert(
                "API Key 保存失败。"
            );

            return;
        }

        keyStatus.textContent =
            "已设置";

        key.value =
            "";

        keyBox.style.display =
            "none";

    };


document
    .getElementById("clearKey")
    .onclick = () => {

        localStorage.removeItem(
            "wangxing_deepseek_key"
        );

        keyStatus.textContent =
            "未设置";

        alert(
            "DeepSeek API Key 已清除。"
        );

    };


function checkKey(){

    const saved =
        localStorage.getItem(
            "wangxing_deepseek_key"
        );

    if(saved){

        keyStatus.textContent =
            "已设置";

    }else{

        keyStatus.textContent =
            "未设置";

    }

}

checkKey();


/* =========================
   六爻文字
========================= */

function getYaoText(){

    return allYao
        .map(
            (v,i) =>
                `第${i+1}爻：${v}（${getYaoState(v)}）`
        )
        .join("\n");

}


/* =========================
   DeepSeek AI
========================= */

ai.addEventListener(
    "click",
    requestAI
);


async function requestAI(){

    const apiKey =
        localStorage.getItem(
            "wangxing_deepseek_key"
        );

    if(!apiKey){

        keyBox.style.display =
            "block";

        answer.textContent =
            "请先设置 DeepSeek API Key。";

        return;
    }

    if(
        !question ||
        allYao.length !== 6
    ){

        answer.textContent =
            "请先完成六爻起卦。";

        return;
    }


    const original =
        allYao.slice();

    const changed =
        allYao.map(v => {

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        });


    const benName =
        getHexName(original);

    const changeName =
        getHexName(changed);


    const moving =
        allYao
            .map(
                (v,i) =>
                    (
                        v === 6 ||
                        v === 9
                    )
                    ? `第${i+1}爻`
                    : null
            )
            .filter(Boolean)
            .join("、");


    const prompt = `

用户问题：

${question}

本卦：

${benName}

变卦：

${changeName}

动爻：

${moving || "无动爻"}

六爻数据：

${getYaoText()}

请针对“用户问题”本身进行六爻解读。

要求：

1. 先直接给出结论。
2. 必须围绕用户实际问题。
3. 结合本卦、动爻、变卦分析。
4. 不要泛泛而谈。
5. 不要把回答变成人生建议。
6. 如果卦象只能判断趋势，要明确使用“倾向于”等表述。
7. 不要虚构不存在的爻辞或卦象信息。

回答格式：

【直接结论】

【本卦】

【动爻】

【变卦】

【最终判断】

`;


    ai.disabled = true;

    ai.textContent =
        "正在解读……";

    answer.textContent =
        "正在连接 DeepSeek……";


    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            30000
        );


    try{

        console.log(
            "WANGXING：开始请求 DeepSeek"
        );


        const response =
            await fetch(
                "https://api.deepseek.com/chat/completions",
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            apiKey

                    },

                    body:JSON.stringify({

                        model:
                            "deepseek-chat",

                        messages:[

                            {
                                role:
                                    "system",

                                content:
                                    "你是专业的传统六爻与大衍筮法解卦助手。严格围绕用户的问题回答，不泛泛扩展，不主动给人生建议。"
                            },

                            {
                                role:
                                    "user",

                                content:
                                    prompt
                            }

                        ],

                        temperature:
                            0.3,

                        max_tokens:
                            3000,

                        stream:
                            false

                    }),

                    signal:
                        controller.signal

                }
            );


        const raw =
            await response.text();


        console.log(
            "DeepSeek HTTP：",
            response.status
        );


        console.log(
            "DeepSeek Response：",
            raw
        );


        let data;

        try{

            data =
                JSON.parse(raw);

        }catch(e){

            throw new Error(
                "DeepSeek 返回的不是有效 JSON。"
            );

        }


        if(!response.ok){

            throw new Error(
                data?.error?.message ||
                `HTTP ${response.status}`
            );

        }


        const content =
            data
            ?.choices
            ?.[0]
            ?.message
            ?.content;


        if(!content){

            throw new Error(
                "DeepSeek 没有返回解读内容。"
            );

        }


        answer.textContent =
            content;


        status.textContent =
            "AI 解读完成。";


    }catch(error){

        console.error(
            "DeepSeek Error：",
            error
        );


        if(
            error.name ===
            "AbortError"
        ){

            answer.textContent =
                "解读失败：DeepSeek 请求超过 30 秒没有返回。";

        }else{

            answer.textContent =
                "解读失败：" +
                error.message;

        }

    }finally{

        clearTimeout(timeout);

        ai.disabled = false;

        ai.textContent =
            "✦ 解读";

    }

}

</script>
