<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>望星 · 大衍筮法</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f1e8;
    color:#29251f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "PingFang SC","Microsoft YaHei",sans-serif;
}

.container{
    width:min(920px,94%);
    margin:auto;
    padding:30px 0 70px;
}

header{
    text-align:center;
    margin-bottom:28px;
}

.logo{
    font-family:"KaiTi","STKaiti",serif;
    font-size:42px;
    letter-spacing:8px;
}

.subtitle{
    margin-top:8px;
    color:#81786c;
    font-size:14px;
    letter-spacing:3px;
}

.card{
    background:#fffdf8;
    border:1px solid #e5ddcf;
    border-radius:16px;
    padding:24px;
    margin-bottom:18px;
    box-shadow:0 4px 20px rgba(70,50,20,.05);
}

h2{
    margin:0 0 18px;
    font-size:20px;
}

textarea,input,select{
    width:100%;
    border:1px solid #d9d0c1;
    border-radius:10px;
    background:#fff;
    padding:13px 14px;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:105px;
    resize:vertical;
}

textarea:focus,input:focus,select:focus{
    border-color:#9d8a70;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.primary{
    background:#29251f;
    color:#fff;
}

.secondary{
    background:#eee7db;
    color:#39332b;
}

.danger{
    background:#eee0dc;
    color:#8a3e31;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.row>*{
    flex:1;
}

.small{
    font-size:12px;
    color:#877e72;
    line-height:1.8;
}

.status{
    margin-top:16px;
    padding:13px 15px;
    border-radius:10px;
    background:#f3eee5;
    color:#665e54;
    font-size:14px;
    line-height:1.7;
}

.status.success{
    background:#e9f1e8;
    color:#496143;
}

.status.error{
    background:#f5e7e3;
    color:#874438;
}

.status.loading{
    background:#eee9df;
    color:#61584d;
}

.hidden{
    display:none!important;
}

/* 六爻 */

.line-box{
    margin-top:22px;
}

.line{
    border:1px solid #e2d9cb;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    background:#fff;
}

.line-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.line-number{
    font-weight:600;
}

.line-result{
    font-family:"KaiTi","STKaiti",serif;
    font-size:18px;
}

.yin-yang{
    font-size:13px;
    color:#756d63;
}

.changing{
    color:#8b4034;
    font-weight:600;
}

.steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.step{
    border:1px solid #ddd4c7;
    border-radius:8px;
    padding:9px;
    background:#faf8f3;
    font-size:12px;
    text-align:center;
}

.step.done{
    background:#ece5d8;
    border-color:#c9bca8;
}

.draw-area{
    margin-top:20px;
    text-align:center;
}

.draw-button{
    width:100%;
    padding:16px;
    font-size:16px;
}

.selection{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:14px;
}

.selection button{
    padding:18px 10px;
    background:#f3eee5;
    border:1px solid #ddd3c5;
}

.selection button:hover{
    background:#e9e0d2;
}

/* 卦象 */

.result-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.result-item{
    border:1px solid #e2d9cb;
    border-radius:10px;
    padding:14px;
    background:#fff;
}

.result-label{
    font-size:12px;
    color:#877e72;
    margin-bottom:6px;
}

.result-value{
    font-size:16px;
    font-weight:600;
}

.hexagram{
    text-align:center;
    padding:25px 10px;
}

.hexagram-name{
    font-family:"KaiTi","STKaiti",serif;
    font-size:32px;
}

.hexagram-info{
    color:#777066;
    font-size:13px;
    margin-top:6px;
}

.hexagram-lines{
    width:190px;
    margin:25px auto;
}

.hex-line{
    height:14px;
    margin:9px 0;
    display:flex;
    gap:18px;
    position:relative;
}

.hex-line span{
    display:block;
    height:7px;
    background:#29251f;
    border-radius:2px;
    flex:1;
}

.hex-line.changing span{
    background:#8b4034;
}

.hex-line.yin span{
    flex:0 0 calc(50% - 9px);
}

/* AI */

.ai-output{
    line-height:1.9;
    font-size:15px;
    white-space:pre-wrap;
}

.ai-progress{
    margin-top:15px;
    height:5px;
    background:#e7e0d5;
    border-radius:10px;
    overflow:hidden;
}

.ai-progress-bar{
    height:100%;
    width:30%;
    background:#665b4d;
    animation:loading 1.5s infinite;
}

@keyframes loading{
    from{transform:translateX(-120%)}
    to{transform:translateX(400%)}
}

/* 历史 */

.history-item{
    border:1px solid #e2d9cb;
    border-radius:10px;
    padding:15px;
    margin-bottom:10px;
    background:#fff;
    cursor:pointer;
}

.history-item:hover{
    background:#faf7f1;
}

.history-title{
    font-weight:600;
    margin-bottom:7px;
}

.history-meta{
    color:#847b70;
    font-size:12px;
    line-height:1.7;
}

@media(max-width:600px){
    .container{padding-top:20px}
    .logo{font-size:34px}
    .card{padding:17px}
    .result-grid{grid-template-columns:1fr}
    .selection{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">望星</div>
    <div class="subtitle">大衍筮法 · 问卜于心</div>
</header>

<!-- 问题 -->

<section class="card">

<h2>一 · 所问之事</h2>

<textarea
id="question"
placeholder="请写下你真正想问的问题。建议具体、明确，例如：我在八月底之前能否获得一份厦门的工作？"></textarea>

<div class="row" style="margin-top:12px">
    <button class="primary" id="startBtn">开始起卦</button>
    <button class="secondary" id="newBtn">重新开始</button>
</div>

<div id="mainStatus" class="status hidden"></div>

</section>


<!-- 大衍筮法 -->

<section class="card hidden" id="divinationCard">

<h2>二 · 大衍筮法</h2>

<div class="small">
    大衍之数五十，其用四十有九。每一爻经过三变：
    分二、挂一、揲四、归奇。三变完成后得到一爻。
    六爻完成后自动生成本卦、变卦及动爻。
</div>

<div id="sticksInfo" class="status">
    当前蓍草：49
</div>

<div class="line-box" id="lines"></div>

<div class="draw-area">

<div id="currentInstruction" class="status">
    请开始第一变。
</div>

<button
id="drawBtn"
class="primary draw-button">
    开始第一变
</button>

<div id="selection" class="selection hidden">
    <button id="takeLeft">从左边取</button>
    <button id="takeRight">从右边取</button>
</div>

</div>

</section>


<!-- 成卦 -->

<section class="card hidden" id="resultCard">

<h2>三 · 成卦</h2>

<div class="result-grid">

<div class="result-item">
    <div class="result-label">本卦</div>
    <div class="result-value" id="originalName">—</div>
</div>

<div class="result-item">
    <div class="result-label">变卦</div>
    <div class="result-value" id="changedName">—</div>
</div>

<div class="result-item">
    <div class="result-label">动爻</div>
    <div class="result-value" id="changingLines">—</div>
</div>

<div class="result-item">
    <div class="result-label">起卦时间</div>
    <div class="result-value" id="divinationTime">—</div>
</div>

</div>

<div class="hexagram">

<div id="bigHexagramName" class="hexagram-name">—</div>

<div id="hexagramInfo" class="hexagram-info">—</div>

<div id="hexagramLines" class="hexagram-lines"></div>

</div>

<button
id="aiBtn"
class="primary"
style="width:100%">
AI 解读此卦
</button>

</section>


<!-- AI -->

<section class="card hidden" id="aiCard">

<h2>四 · 卦象解读</h2>

<div id="aiStatus" class="status loading">
    正在等待 AI……
</div>

<div id="aiProgress" class="ai-progress hidden">
    <div class="ai-progress-bar"></div>
</div>

<div
id="aiOutput"
class="ai-output"
style="margin-top:18px"></div>

</section>


<!-- AI设置 -->

<section class="card">

<h2>AI 设置</h2>

<div class="small" style="margin-bottom:12px">
    API Key 仅保存在当前浏览器 localStorage 中。
    注意：前端直连 API 不适合公开生产环境，因为浏览器中的 Key
    仍可能被访问者查看。
</div>

<input
id="apiKey"
type="password"
placeholder="请输入 API Key">

<div style="height:10px"></div>

<select id="model">
    <option value="gpt-5">GPT-5</option>
    <option value="gpt-5-mini">GPT-5 mini</option>
</select>

<div style="height:10px"></div>

<div class="row">

<button class="secondary" id="saveKeyBtn">
    保存 API Key
</button>

<button class="danger" id="clearKeyBtn">
    清除 API Key
</button>

</div>

<div id="keyStatus" class="status hidden"></div>

</section>


<!-- 历史 -->

<section class="card">

<div class="row" style="align-items:center">
    <h2 style="margin:0;flex:1">历史记录</h2>

    <button
    class="danger"
    id="clearHistoryBtn">
        清空历史
    </button>
</div>

<div id="history" style="margin-top:16px"></div>

</section>

</div>


<script>

/* =========================================================

========================================================= */

const STORAGE_KEY = "wangxing_api_key";
const MODEL_KEY = "wangxing_model";

/* =========================================================
   状态
========================================================= */

let state = {
    question:"",
    lines:[],
    currentLine:0,
    currentChange:0,
    sticks:49,
    startTime:null,
    finished:false,
    pendingChange:null
};


/* =========================================================

   key = 下卦 + 上卦
========================================================= */

*/

const hexagramNames={

/*

   实际显示名称时再根据上下卦进行组合。
*/

const exactHexagrams = {

"111010":["讼","天水讼"],
"110010":["困","泽水困"],
"101010":["未济","火水未济"],

"010000":["比","水地比"],
"001000":["剥","山地剥"],
"000000":["坤","坤为地"]
};


/* =========================================================
   DOM
========================================================= */

const $=id=>document.getElementById(id);

const question=$("question");
const startBtn=$("startBtn");
const newBtn=$("newBtn");

const divinationCard=$("divinationCard");
const resultCard=$("resultCard");
const aiCard=$("aiCard");

const drawBtn=$("drawBtn");
const selection=$("selection");

const linesEl=$("lines");
const currentInstruction=$("currentInstruction");
const sticksInfo=$("sticksInfo");

const originalName=$("originalName");
const changedName=$("changedName");
const changingLines=$("changingLines");
const divinationTime=$("divinationTime");

const bigHexagramName=$("bigHexagramName");
const hexagramInfo=$("hexagramInfo");
const hexagramLines=$("hexagramLines");

const aiBtn=$("aiBtn");
const aiStatus=$("aiStatus");
const aiOutput=$("aiOutput");
const aiProgress=$("aiProgress");

const apiKey=$("apiKey");
const model=$("model");


/* =========================================================
   工具
========================================================= */

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

function randomInt(min,max){
    if(window.crypto && crypto.getRandomValues){
        const array=new Uint32Array(1);
        crypto.getRandomValues(array);
        return min+(array[0]%(max-min+1));
    }

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;
}

function showMainStatus(text,type=""){
    const el=$("mainStatus");
    el.textContent=text;
    el.className="status "+type;
    el.classList.remove("hidden");
}

function formatDate(date){
    return date.getFullYear()+"-"+
        String(date.getMonth()+1).padStart(2,"0")+"-"+
        String(date.getDate()).padStart(2,"0")+" "+
        String(date.getHours()).padStart(2,"0")+":"+
        String(date.getMinutes()).padStart(2,"0")+":"+
        String(date.getSeconds()).padStart(2,"0");
}


/* =========================================================
   开始起卦
========================================================= */

startBtn.onclick=()=>{

    const q=question.value.trim();

    if(!q){
        showMainStatus("请先写下你想问的问题。","error");
        question.focus();
        return;
    }

    state={
        question:q,
        lines:[],
        currentLine:0,
        currentChange:0,
        sticks:49,
        startTime:new Date().toISOString(),
        finished:false,
        pendingChange:null
    };

    resultCard.classList.add("hidden");
    aiCard.classList.add("hidden");

    divinationCard.classList.remove("hidden");

    drawBtn.disabled=false;
    drawBtn.textContent="开始第一变";

    selection.classList.add("hidden");

    renderLines();

    updateSticks();

    currentInstruction.textContent=
        "第一爻 · 第一变：开始分二。";

    showMainStatus(
        "问题已经确定，现在开始大衍筮法。",
        "success"
    );

    divinationCard.scrollIntoView({
        behavior:"smooth"
    });
};


/* =========================================================
   重新开始
========================================================= */

newBtn.onclick=()=>{

    state={
        question:"",
        lines:[],
        currentLine:0,
        currentChange:0,
        sticks:49,
        startTime:null,
        finished:false,
        pendingChange:null
    };

    question.value="";

    divinationCard.classList.add("hidden");
    resultCard.classList.add("hidden");
    aiCard.classList.add("hidden");

    $("mainStatus").classList.add("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
};


/* =========================================================
   显示六爻
========================================================= */

function renderLines(){

    linesEl.innerHTML="";

    for(let i=5;i>=0;i--){

        const line=state.lines[i];

        const box=document.createElement("div");
        box.className="line";

        const head=document.createElement("div");
        head.className="line-head";

        const title=document.createElement("div");
        title.className="line-number";
        title.textContent=
            `${i+1}爻 · ${
                i===5?"上爻":
                i===0?"初爻":
                ""
            }`;

        const result=document.createElement("div");
        result.className="line-result";

        result.textContent=
            line ?
            `${line.type}（${line.value}）`
            :
            "未完成";

        head.appendChild(title);
        head.appendChild(result);

        box.appendChild(head);

        if(line){

            const info=document.createElement("div");
            info.className="yin-yang";

            info.innerHTML=
                `三变：
                ${line.changes.join(" → ")}
                ${
                    line.changing
                    ?
                    `｜<span class="changing">动爻</span>`
                    :
                    "｜静爻"
                }`;

            box.appendChild(info);

            const steps=document.createElement("div");
            steps.className="steps";

            line.changes.forEach((change,index)=>{

                const step=document.createElement("div");
                step.className="step done";

                step.textContent=
                    `第${index+1}变：${change}`;

                steps.appendChild(step);
            });

            box.appendChild(steps);
        }

        linesEl.appendChild(box);
    }
}


/* =========================================================
   蓍草数量
========================================================= */

function updateSticks(){
    sticksInfo.textContent=
        `当前蓍草：${state.sticks}`;
}


/* =========================================================
   开始一变
========================================================= */

drawBtn.onclick=()=>{

    if(state.finished) return;

    if(state.currentChange>=3){
        return;
    }

    drawBtn.disabled=true;

    selection.classList.add("hidden");

    currentInstruction.textContent=
        `第${state.currentLine+1}爻 · 第${state.currentChange+1}变：正在分二……`;

    setTimeout(()=>{

        currentInstruction.textContent=
            "请选择从哪一边取一策挂一。";

        selection.classList.remove("hidden");

    },300);
};


/* =========================================================
   左 / 右
========================================================= */

$("takeLeft").onclick=()=>performChange("left");
$("takeRight").onclick=()=>performChange("right");


/*
    真正的大衍筮法：

    1. 分二
    2. 从右手取一策挂一
    3. 左右两堆分别揲四
    4. 各取余数
    5. 归奇
    6. 剩余蓍草进入下一变
*/

function performChange(side){

    selection.classList.add("hidden");

    const total=state.sticks;

    if(total<5){

        currentInstruction.textContent=
            "蓍草数量异常，无法继续。";

        return;
    }


    /*
       分二：
       随机分为左右两堆。
       用户选择哪边作为“挂一”的右手堆。
    */

    let left;
    let right;

    /*
       避免出现空堆。
    */

    left=randomInt(1,total-1);
    right=total-left;


    /*
       用户选择左 / 右只决定哪一堆作为挂一。
    */

    let hanging;

    if(side==="left"){
        hanging=left;
        left--;
    }else{
        hanging=right;
        right--;
    }


    /*
       挂一之后：
       左右各自揲四。
    */

    const leftRemainder=
        remainderFour(left);

    const rightRemainder=
        remainderFour(right);


    /*
       归奇：
       余数 0 按 4 计算。
    */

    const removed=
        1+
        leftRemainder+
        rightRemainder;

    const remaining=
        total-removed;

    state.sticks=remaining;

    updateSticks();


    if(!state.lines[state.currentLine]){

        state.lines[state.currentLine]={
            changes:[],
            sides:[],
            changing:false,
            value:null,
            type:"",
            total:0
        };
    }

    const line=state.lines[state.currentLine];

    line.changes.push(remaining);
    line.sides.push(side);

    currentInstruction.textContent=
        `第${state.currentLine+1}爻 · 第${state.currentChange+1}变完成：`
        +
        `分二 ${left}/${right}，`
        +
        `归奇 ${removed}，`
        +
        `余 ${remaining} 策。`;

    state.currentChange++;

    /*
       第三变完成：
       根据三变后总数决定爻。
    */

    if(state.currentChange===3){

        finalizeLine();

        return;
    }


    /*
       下一变：
       将当前剩余蓍草重新使用。
    */

    setTimeout(()=>{

        drawBtn.disabled=false;

        drawBtn.textContent=
            `开始第${state.currentChange+1}变`;

        currentInstruction.textContent=
            `第${state.currentLine+1}爻 · 第${state.currentChange+1}变：重新分二。`;

    },500);
}


/* =========================================================
   揲四余数
========================================================= */

function remainderFour(number){

    const r=number%4;

    return r===0 ? 4 : r;
}


/* =========================================================
   完成一爻
========================================================= */

function finalizeLine(){

    const line=state.lines[state.currentLine];

    const sum=
        line.changes[
            line.changes.length-1
        ];


    /*
       三变后的余数：

       24 -> 老阴 6
       28 -> 少阳 7
       32 -> 少阴 8
       36 -> 老阳 9
    */

    let value;

    if(sum===24){
        value=6;
    }else if(sum===28){
        value=7;
    }else if(sum===32){
        value=8;
    }else if(sum===36){
        value=9;
    }else{

        /*
           理论上不会出现其他结果。
           为避免异常，按照最接近值处理。
        */

        const candidates=[24,28,32,36];

        let closest=candidates[0];

        for(const c of candidates){

            if(
                Math.abs(c-sum)<
                Math.abs(closest-sum)
            ){
                closest=c;
            }
        }

        value=
            closest===24?6:
            closest===28?7:
            closest===32?8:
            9;
    }


    line.value=value;

    line.changing=
        value===6 ||
        value===9;

    line.type=
        value===6 ? "老阴" :
        value===7 ? "少阳" :
        value===8 ? "少阴" :
        "老阳";


    renderLines();


    /*
       每爻完成后重新恢复 49 策。
       这是下一爻重新开始三变的基础。
    */

    state.sticks=49;

    updateSticks();


    /*
       六爻完成
    */

    if(state.currentLine===5){

        state.finished=true;

        drawBtn.disabled=true;

        currentInstruction.textContent=
            "六爻完成，正在生成本卦、变卦……";

        setTimeout(buildHexagram,500);

        return;
    }


    /*
       自动进入下一爻。
    */

    state.currentLine++;
    state.currentChange=0;

    drawBtn.disabled=false;

    drawBtn.textContent="开始第一变";

    currentInstruction.textContent=
        `第${state.currentLine+1}爻 · 第一变：重新开始。`;
}


/* =========================================================
   成卦
========================================================= */

function buildHexagram(){

    /*
       state.lines 的顺序：
       初爻 → 二爻 → ... → 上爻

       阳 = 1
       阴 = 0
    */

    const originalBits=
        state.lines
        .map(line=>
            line.value===7 ||
            line.value===9
            ? "1":"0"
        )
        .join("");


    const changedBits=
        state.lines
        .map(line=>{

            /*
               老阴 6：阴变阳
               老阳 9：阳变阴
            */

            if(line.value===6) return "1";
            if(line.value===9) return "0";

            return line.value===7
                ? "1"
                : "0";

        })
        .join("");


    const original=
        exactHexagrams[originalBits];

    const changed=
        exactHexagrams[changedBits];


    const moving=
        state.lines
        .map((line,index)=>
            line.changing
            ? index+1
            : null
        )
        .filter(Boolean);


    originalName.textContent=
        original
        ? original[1]
        : "未知卦";

    changedName.textContent=
        changed
        ? changed[1]
        : "未知卦";

    changingLines.textContent=
        moving.length
        ? moving.map(n=>`第${n}爻`).join("、")
        : "无动爻";

    divinationTime.textContent=
        formatDate(
            new Date(state.startTime)
        );

    bigHexagramName.textContent=
        original
        ? original[1]
        : "未知卦";

    hexagramInfo.textContent=
        `本卦：${original?original[1]:"未知"}`
        +
        ` ｜ 变卦：${changed?changed[1]:"未知"}`;

    renderHexagram(originalBits);

    resultCard.classList.remove("hidden");

    saveHistory();

    showMainStatus(
        "六爻完成，本卦、变卦和动爻已经生成。",
        "success"
    );

    resultCard.scrollIntoView({
        behavior:"smooth"
    });
}


/* =========================================================
   卦画
========================================================= */

function renderHexagram(bits){

    hexagramLines.innerHTML="";

    /*
       从上爻显示到初爻。
    */

    for(let i=5;i>=0;i--){

        const value=state.lines[i].value;

        const row=document.createElement("div");

        row.className="hex-line";

        if(value===6 || value===8){
            row.classList.add("yin");
        }

        if(value===6 || value===9){
            row.classList.add("changing");
        }


        const a=document.createElement("span");
        const b=document.createElement("span");

        row.appendChild(a);
        row.appendChild(b);

        hexagramLines.appendChild(row);
    }
}

/* =========================================================
   AI解读
========================================================= */

aiBtn.onclick=async()=>{

    if(!state.finished){

        alert("请先完成六爻起卦。");

        return;
    }

    const key=apiKey.value.trim();

    if(!key){

        aiCard.classList.remove("hidden");

        aiStatus.className=
            "status error";

        aiStatus.textContent=
            "请先填写 API Key。";

        aiCard.scrollIntoView({
            behavior:"smooth"
        });

        return;
    }


    aiCard.classList.remove("hidden");

    aiOutput.textContent="";

    aiProgress.classList.remove("hidden");

    aiBtn.disabled=true;


    try{

        const result=
            await requestAIWithRetry(key);

        aiOutput.textContent=result;

        aiStatus.className=
            "status success";

        aiStatus.textContent=
            "解读完成。";

    }catch(error){

        aiStatus.className=
            "status error";

        aiStatus.textContent=
            readableError(error);

    }finally{

        aiProgress.classList.add("hidden");

        aiBtn.disabled=false;
    }


    aiCard.scrollIntoView({
        behavior:"smooth"
    });
};


/* =========================================================
   AI 自动重试
========================================================= */

async function requestAIWithRetry(key){

    const maxRetries=3;

    let lastError=null;

    for(let attempt=1;attempt<=maxRetries;attempt++){

        try{

            aiStatus.className=
                "status loading";

            aiStatus.textContent=
                attempt===1
                ?
                "正在连接 AI，正在分析卦象……"
                :
                `AI 响应较慢，正在自动重试（${attempt}/${maxRetries}）……`;


            return await requestAI(key);

        }catch(error){

            lastError=error;

            if(attempt<maxRetries){

                await sleep(
                    attempt===1
                    ? 2000
                    : 4000
                );
            }
        }
    }

    throw lastError;
}


/* =========================================================
   单次API请求
========================================================= */

async function requestAI(key){

    const controller=
        new AbortController();

    const timer=
        setTimeout(
            ()=>controller.abort(),
            60000
        );


    try{

        const response=
            await fetch(
                "https://api.openai.com/v1/responses",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${key}`
                    },

                    body:JSON.stringify({

                        model:model.value,

                        input:buildPrompt(),

                        max_output_tokens:4000
                    }),

                    signal:controller.signal
                }
            );


        if(!response.ok){

            let message="";

            try{

                const data=
                    await response.json();

                message=
                    data?.error?.message || "";

            }catch(e){}

            const error=
                new Error(
                    message ||
                    `API 请求失败：HTTP ${response.status}`
                );

            error.status=
                response.status;

            throw error;
        }


        const data=
            await response.json();


        /*
           Responses API 优先读取 output_text。
        */

        if(
            typeof data.output_text==="string" &&
            data.output_text.trim()
        ){

            return data.output_text.trim();
        }


        /*
           兼容完整 output 结构。
        */

        let text="";


        if(Array.isArray(data.output)){

            for(const item of data.output){

                if(!Array.isArray(item.content))
                    continue;

                for(const content of item.content){

                    if(
                        content.type==="output_text" &&
                        typeof content.text==="string"
                    ){

                        text+=content.text;
                    }
                }
            }
        }


        if(!text.trim()){

            throw new Error(
                "AI 返回为空，请稍后重试。"
            );
        }


        return text.trim();

    }finally{

        clearTimeout(timer);
    }
}


/* =========================================================
   AI Prompt
========================================================= */

function buildPrompt(){

    const original=
        originalName.textContent;

    const changed=
        changedName.textContent;

    const moving=
        changingLines.textContent;


    const lines=
        state.lines
        .map((line,index)=>
            `${index+1}爻：${line.type}（${line.value}）
三变：${line.changes.join(" → ")}
动静：${line.changing?"动爻":"静爻"}`
        )
        .join("\n");


    return `
你是一名严格按照传统易学卦理进行卦象分析的解读者。

你的任务不是给用户泛泛的人生建议，而是直接回答用户提出的问题。

【用户问题】
${state.question}

【本卦】
${original}

【变卦】
${changed}

【动爻】
${moving}

【六爻】
${lines}

请严格围绕用户最初的问题进行判断。

回答结构：

一、直接结论
第一段直接回答用户的问题。
如果问题是“能不能”“会不会”“是否可以”“什么时候”，必须优先回答这个问题。

二、卦象依据
解释本卦为什么支持或不支持这个判断。

三、动爻分析
逐个分析动爻，并说明它们与用户问题之间的直接关系。

四、发展趋势
按照当前、发展、后续说明事情走势。
如果涉及时间，只给出卦象能够支持的大致时间范围，不要虚构精确日期。

五、最终判断
用一段话再次明确回答最初的问题。

重要规则：

1. 不要改变用户的问题。
2. 不要主动扩展到用户没有问的事情。
3. 不要突然分析恋爱、健康、财运等无关领域。
4. 不要把预测问题变成心理咨询。
5. 不要大量使用“建议你”“你应该”。
6. 结论偏不利时直接说不利。
7. 结论偏有利时直接说有利。
8. 存在明显变数时说明变数来源。
9. 必须以本卦、变卦、动爻为核心证据。
10. 不要为了让答案好听而刻意美化卦象。
`;
}


/* =========================================================
   API错误
========================================================= */

function readableError(error){

    if(!error){
        return "AI 解读失败。";
    }

    if(error.name==="AbortError"){
        return "AI 请求超过 60 秒没有返回。系统已经自动重试 3 次，请稍后再试。";
    }

    if(error.status===401){
        return "API Key 无效或已经失效，请检查 API Key。";
    }

    if(error.status===403){
        return "API Key 没有权限调用当前模型。";
    }

    if(error.status===429){
        return "API 请求过于频繁，或者当前 API 额度不足。";
    }

    if(error.status>=500){
        return "AI 服务暂时异常。系统已经自动重试 3 次，请稍后再试。";
    }

    if(
        error.message &&
        (
            error.message.includes("Failed to fetch") ||
            error.message.includes("NetworkError")
        )
    ){
        return "网络请求没有正常完成。系统已经自动重试 3 次，请检查当前网络或 API 服务连接。";
    }

    return error.message ||
        "AI 解读失败，请稍后再试。";
}


/* =========================================================
   历史记录
========================================================= */

function saveHistory(){

    const history=
        JSON.parse(
            localStorage.getItem(HISTORY_KEY)||"[]"
        );


    const original=
        originalName.textContent;

    const changed=
        changedName.textContent;


    const record={
        id:Date.now(),
        question:state.question,
        original,
        changed,
        moving:changingLines.textContent,
        time:state.startTime,

        lines:
            state.lines.map(line=>({
                value:line.value,
                type:line.type,
                changing:line.changing,
                changes:line.changes,
                sides:line.sides
            }))
    };


    history.unshift(record);

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history.slice(0,50)
        )
    );

    renderHistory();
}


function renderHistory(){

    const history=
        JSON.parse(
            localStorage.getItem(HISTORY_KEY)||"[]"
        );

    const el=$("history");

    el.innerHTML="";


    if(!history.length){

        el.innerHTML=
            `<div class="small">暂无历史记录。</div>`;

        return;
    }


    history.forEach(item=>{

        const box=
            document.createElement("div");

        box.className="history-item";


        const title=
            document.createElement("div");

        title.className="history-title";

        title.textContent=
            item.question;


        const meta=
            document.createElement("div");

        meta.className="history-meta";

        meta.textContent=
            `${item.original} → ${item.changed}`
            +
            ` ｜ ${item.moving}`
            +
            ` ｜ ${formatDate(new Date(item.time))}`;


        box.appendChild(title);
        box.appendChild(meta);


        box.onclick=()=>{
            loadHistory(item);
        };


        el.appendChild(box);
    });
}


/* =========================================================
   打开历史
========================================================= */

function loadHistory(item){

    state={
        question:item.question,
        lines:item.lines.map(line=>({
            value:line.value,
            type:line.type,
            changing:line.changing,
            changes:line.changes,
            sides:line.sides||[]
        })),
        currentLine:6,
        currentChange:3,
        sticks:49,
        startTime:item.time,
        finished:true
    };


    question.value=
        item.question;


    renderLines();


    originalName.textContent=
        item.original;

    changedName.textContent=
        item.changed;

    changingLines.textContent=
        item.moving;

    divinationTime.textContent=
        formatDate(
            new Date(item.time)
        );

    bigHexagramName.textContent=
        item.original;

    hexagramInfo.textContent=
        `本卦：${item.original} ｜ 变卦：${item.changed}`;


    /*
       根据历史六爻重新画卦。
    */

    const bits=
        state.lines
        .map(line=>
            line.value===7 ||
            line.value===9
            ? "1":"0"
        )
        .join("");


    renderHexagram(bits);


    divinationCard.classList.remove("hidden");
    resultCard.classList.remove("hidden");
    aiCard.classList.add("hidden");


    showMainStatus(
        "已经打开历史记录。",
        "success"
    );


    resultCard.scrollIntoView({
        behavior:"smooth"
    });
}

$("clearHistoryBtn").onclick=()=>{

    if(
        !confirm("确定要清空全部历史记录吗？")

        return;
    }

    localStorage.removeItem(

};
