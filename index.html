<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>WANGXING · 大衍筮法</title>

<style>

/* =====================================================
   基础
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:#01090c;
    color:#d9ffff;
    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =====================================================
   动态星河背景
===================================================== */

#stars{
    position:fixed;
    inset:0;
    z-index:0;
    background:#01090c;
}

.space{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
}

.nebula{
    position:absolute;
    inset:-20%;

    background:

        radial-gradient(
            ellipse at 50% 10%,
            rgba(50,255,236,.38),
            transparent 24%
        ),

        radial-gradient(
            ellipse at 15% 35%,
            rgba(0,180,220,.24),
            transparent 27%
        ),

        radial-gradient(
            ellipse at 85% 45%,
            rgba(25,240,215,.20),
            transparent 25%
        ),

        radial-gradient(
            ellipse at 45% 80%,
            rgba(0,120,180,.20),
            transparent 30%
        );

    filter:blur(20px);

    animation:
        drift 20s ease-in-out infinite alternate;
}

@keyframes drift{

    from{
        transform:scale(1);
    }

    to{
        transform:
            scale(1.08)
            translate(2%,-1%);
    }

}


/* =====================================================
   页面
===================================================== */

.container{

    position:relative;
    z-index:2;

    max-width:1450px;

    margin:auto;

    padding:
        34px
        42px
        50px;
}


/* =====================================================
   Header
===================================================== */

header{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    margin-bottom:24px;
}

.logo{
    letter-spacing:.12em;
}

.en{

    font:
        32px
        Georgia,
        serif;

    color:#c1ffff;
}

.cn{

    font-size:29px;

    margin-top:5px;
}

.sub{

    margin-top:8px;

    font-size:12px;

    color:#689497;
}

.nav{

    display:flex;

    gap:28px;

    color:#78a7aa;

    font-size:12px;
}

.nav div{

    text-align:center;

    cursor:pointer;
}

.nav b{

    display:block;

    font-size:20px;

    font-weight:400;

    margin-bottom:4px;
}


/* =====================================================
   Layout
===================================================== */

.grid{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:18px;
}

.panel{

    background:
        linear-gradient(
            145deg,
            rgba(3,29,35,.84),
            rgba(1,15,20,.78)
        );

    border:
        1px solid
        rgba(60,218,214,.42);

    border-radius:18px;

    box-shadow:

        0 0 35px
        rgba(23,203,202,.07),

        inset 0 0 30px
        rgba(67,240,233,.025);

    backdrop-filter:blur(10px);
}

.pad{
    padding:24px 28px;
}

h2{

    font-size:19px;

    font-weight:500;

    color:#aaf2ef;

    letter-spacing:.08em;

    margin:
        0
        0
        17px;
}


/* =====================================================
   输入
===================================================== */

textarea{

    width:100%;

    height:108px;

    resize:none;

    outline:none;

    background:
        rgba(0,13,18,.72);

    border:
        1px solid
        #287b80;

    border-radius:11px;

    color:#d9ffff;

    padding:15px;

    font:
        15px
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

textarea:focus{

    border-color:#5be9e3;

    box-shadow:
        0 0 18px
        rgba(61,227,220,.13);
}


/* =====================================================
   按钮
===================================================== */

.actions{

    display:flex;

    gap:12px;

    margin-top:16px;

    flex-wrap:wrap;
}

.btn{

    border:
        1px solid
        #48d6d2;

    background:
        linear-gradient(
            180deg,
            #41c8c7,
            #169b9d
        );

    color:#efffff;

    border-radius:9px;

    padding:
        12px
        20px;

    cursor:pointer;

    font:inherit;

    box-shadow:
        0 0 18px
        rgba(54,217,212,.14);
}

.btn.alt{

    background:transparent;

    color:#91babc;

    border-color:#286d72;
}

.btn:disabled{

    opacity:.4;

    cursor:not-allowed;
}

.hint,
.status{

    font-size:12px;

    color:#638d90;

    line-height:1.8;
}


/* =====================================================
   起筮区域
===================================================== */

.stage{

    min-height:600px;

    margin-top:18px;

    padding:
        25px
        22px;
}

.stage-title{

    text-align:center;

    color:#b2f5f1;

    font-size:19px;

    letter-spacing:.08em;
}

.stage-desc{

    text-align:center;

    color:#658f92;

    font-size:12px;

    line-height:1.8;

    min-height:43px;

    margin-top:7px;
}


/* =====================================================
   进度条
===================================================== */

.progress{

    height:5px;

    background:#08262a;

    border-radius:10px;

    overflow:hidden;

    margin:
        15px
        0;
}

.progress i{

    display:block;

    width:0;

    height:100%;

    background:#55dfda;

    box-shadow:
        0 0 12px
        #43e3dc;

    transition:.6s;
}


/* =====================================================
   筮草区域
===================================================== */

.pile-area{

    min-height:260px;

    margin:
        12px
        0;

    display:flex;

    justify-content:center;

    align-items:center;
}

.ritual{

    text-align:center;

    color:#c2ffff;

    font-size:16px;

    letter-spacing:.08em;
}

.ritual-sub{

    margin-top:8px;

    color:#638f92;

    font-size:11px;

    letter-spacing:.03em;
}


/* =====================================================
   单根筮草
===================================================== */

.single-stalk{

    width:5px;

    height:80px;

    margin:
        20px
        auto;

    border-radius:5px;

    background:
        linear-gradient(
            180deg,
            #efffff,
            #50d8d2
        );

    box-shadow:
        0 0 18px
        rgba(82,224,217,.65);

    animation:
        hang 1.2s ease forwards;
}

@keyframes hang{

    from{

        opacity:0;

        transform:
            translateY(-40px)
            rotate(-20deg);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            rotate(0);
    }

}


/* =====================================================
   整体筮草
===================================================== */

.combined-pile{

    width:
        min(
            620px,
            95%
        );

    min-height:250px;

    border:
        1px solid
        #277276;

    border-radius:18px;

    padding:22px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            ellipse,
            rgba(14,103,108,.25),
            rgba(0,25,30,.18) 60%,
            transparent 80%
        );

    cursor:pointer;

    transition:.3s;

    box-shadow:
        0 0 20px
        rgba(69,222,216,.06);
}

.combined-pile:hover{

    transform:
        translateY(-3px);

    border-color:
        #51dcd7;

    box-shadow:
        0 0 25px
        rgba(69,222,216,.14);
}

.combined-title{

    color:#9dd6d7;

    font-size:14px;

    margin-bottom:15px;
}


/* =====================================================
   筮草视觉
===================================================== */

.stalk-visual{

    width:100%;

    max-width:520px;

    min-height:100px;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    align-content:center;

    gap:3px;

    padding:12px;

    border-radius:12px;

    background:

        radial-gradient(
            ellipse,
            rgba(37,139,143,.17),
            rgba(1,23,28,.30)
        );
}

.stalk{

    width:3px;

    height:31px;

    display:block;

    border-radius:3px;

    background:

        linear-gradient(
            180deg,
            #dcffff,
            #52c9c5
        );

    opacity:.82;

    box-shadow:
        0 0 4px
        rgba(87,225,218,.35);

    animation:
        stalkAppear .35s ease both;
}

@keyframes stalkAppear{

    from{

        opacity:0;

        transform:
            translateY(-10px)
            rotate(0deg);
    }

    to{

        opacity:.82;
    }

}


/* =====================================================
   左右分束
===================================================== */

.pile-row{

    width:100%;

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:14px;
}

.pile{

    min-height:220px;

    padding:17px;

    border:
        1px dashed
        #277276;

    border-radius:14px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            ellipse,
            rgba(14,103,108,.23),
            rgba(0,25,30,.18) 60%,
            transparent 78%
        );

    transition:.3s;
}

.pile.highlight{

    border-color:
        #51dcd7;

    box-shadow:
        0 0 22px
        rgba(69,222,216,.13);
}

.pile-title{

    color:#8bbec0;

    font-size:13px;

    margin-bottom:9px;
}

.pile-number{

    font-size:26px;

    color:#c9ffff;

    margin-top:9px;
}

.pile-hint{

    color:#527f82;

    font-size:11px;

    margin-top:7px;
}


/* =====================================================
   过程
===================================================== */

.process-box{

    width:100%;

    max-width:620px;

    margin:auto;

    border:
        1px solid
        #205c61;

    border-radius:13px;

    padding:18px;

    background:
        rgba(2,22,27,.65);
}

.process-title{

    text-align:center;

    color:#9dd6d7;

    font-size:13px;

    margin-bottom:14px;
}

.process-line{

    display:grid;

    grid-template-columns:
        1fr
        auto;

    gap:15px;

    padding:9px 0;

    border-bottom:
        1px solid
        #143b40;

    color:#719b9d;

    font-size:12px;
}

.process-line:last-child{

    border-bottom:0;
}

.process-line strong{

    color:#c8ffff;

    font-size:15px;
}


/* =====================================================
   操作提示
===================================================== */

.choice{

    text-align:center;

    min-height:55px;
}

.choice-title{

    color:#7fa9ab;

    font-size:13px;

    margin-bottom:10px;
}

.choice-buttons{

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;
}

.choice-btn{

    border:
        1px solid
        #317c80;

    background:#052329;

    color:#a7d8d9;

    border-radius:8px;

    padding:
        9px
        15px;

    cursor:pointer;
}

.choice-btn:hover{

    border-color:#5be9e3;

    color:#dfffff;
}


/* =====================================================
   数值
===================================================== */

.counts{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:12px;

    margin-top:10px;
}

.countbox{

    border:
        1px solid
        #205a5f;

    border-radius:11px;

    padding:12px;

    text-align:center;

    color:#79a5a7;
}

.countbox strong{

    display:block;

    font-size:24px;

    color:#c5ffff;

    margin-top:5px;
}


/* =====================================================
   余数
===================================================== */

.remainders{

    display:flex;

    justify-content:center;

    gap:9px;

    flex-wrap:wrap;

    margin:
        13px
        0;
}

.r{

    padding:
        8px
        11px;

    border-radius:9px;

    background:#062329;

    border:
        1px solid
        #23686d;

    color:#8cb8ba;
}

.r b{

    color:#d4ffff;
}


/* =====================================================
   结果
===================================================== */

.result{

    margin-top:15px;

    padding:16px;

    border:
        1px solid
        #245f64;

    border-radius:12px;

    background:
        rgba(1,22,27,.70);

    text-align:center;
}

.result .num{

    font-size:32px;

    color:#bafffa;
}

.result .name{

    font-size:15px;

    color:#7da9ab;

    margin-top:5px;
}


/* =====================================================
   六爻
===================================================== */

.hexwrap{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:25px;

    margin-top:15px;

    text-align:center;
}

.hexname{

    color:#7ea9ab;

    font-size:13px;

    margin-bottom:11px;
}

.hex{

    display:flex;

    flex-direction:column;

    gap:7px;

    align-items:center;
}

.line{

    height:11px;

    width:150px;

    position:relative;
}

.solid,
.broken1,
.broken2{

    position:absolute;

    top:3px;

    height:6px;

    background:#5bdcd8;

    border-radius:5px;

    box-shadow:
        0 0 8px
        rgba(74,225,219,.2);
}

.solid{

    left:0;

    right:0;
}

.broken1{

    left:0;

    width:64px;
}

.broken2{

    right:0;

    width:64px;
}

.movingline .solid,
.movingline .broken1,
.movingline .broken2{

    background:#caffff;

}


/* =====================================================
   六爻表
===================================================== */

.table{

    margin-top:18px;

    border:
        1px solid
        #20565b;

    border-radius:10px;

    overflow:hidden;
}

.tr{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr;

    padding:
        9px
        4px;

    border-bottom:
        1px solid
        #12383c;

    color:#789da0;

    font-size:12px;

    text-align:center;
}

.tr:last-child{

    border-bottom:0;
}

.tr.head{

    color:#94c1c2;

    background:
        rgba(30,101,105,.15);
}

.tr.move{

    background:
        rgba(59,205,201,.08);

    color:#c4eeee;
}


/* =====================================================
   API
===================================================== */

.api{

    margin-top:18px;

    padding:
        14px
        20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;
}

.apiBox{

    display:none;

    margin-top:8px;
}

.apiBox input{

    width:100%;

    background:#02161b;

    border:
        1px solid
        #28646a;

    border-radius:8px;

    color:white;

    padding:10px;

    outline:none;
}

.apiBox button{

    margin-top:8px;
}


/* =====================================================
   AI
===================================================== */

#answer{

    white-space:pre-wrap;

    line-height:1.9;

    color:#c9eeee;

    min-height:80px;

    margin-top:15px;
}


/* =====================================================
   历史
===================================================== */

.modal{

    display:none;

    position:fixed;

    inset:0;

    z-index:20;

    background:
        rgba(0,8,12,.78);

    backdrop-filter:blur(8px);

    padding:30px;
}

.modal.show{

    display:flex;

    align-items:center;

    justify-content:center;
}

.modal-card{

    width:
        min(
            820px,
            100%
        );

    max-height:85vh;

    overflow:auto;

    background:#03171c;

    border:
        1px solid
        #3ed4d0;

    border-radius:18px;

    padding:24px;
}

.modal-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;
}

.history-item{

    border:
        1px solid
        #205a5f;

    border-radius:11px;

    padding:14px;

    margin:10px 0;

    cursor:pointer;

    background:
        rgba(3,31,37,.65);
}

.history-item:hover{

    border-color:
        #50ddd8;
}

.history-question{

    color:#c8ffff;

    margin-bottom:8px;
}

.history-meta{

    font-size:12px;

    color:#6f9da0;

    line-height:1.7;
}

.history-answer{

    margin-top:10px;

    padding-top:10px;

    border-top:
        1px solid
        #174449;

    color:#a9d7d8;

    white-space:pre-wrap;

    line-height:1.8;
}

.empty{

    color:#668f92;

    text-align:center;

    padding:30px;
}


/* =====================================================
   Footer
===================================================== */

.footer{

    text-align:center;

    color:#426b6e;

    font-size:11px;

    margin-top:22px;
}


/* =====================================================
   手机
===================================================== */

@media(max-width:900px){

    .container{

        padding:
            22px
            15px;
    }

    .grid{

        grid-template-columns:
            1fr;
    }

    .nav{

        display:none;
    }

}

@media(max-width:560px){

    .hexwrap{

        grid-template-columns:
            1fr;
    }

    .pile-row{

        grid-template-columns:
            1fr;
    }

    .tr{

        font-size:11px;
    }

    .modal{

        padding:15px;
    }

}

</style>
</head>


<body>

<canvas id="stars"></canvas>

<div class="space">
    <div class="nebula"></div>
</div>


<div class="container">


<header>

<div class="logo">

    <div class="en">
        WANGXING
    </div>

    <div class="cn">
        大衍筮法
    </div>

    <div class="sub">
        一问一卦 · 六爻成象 · 星河筮问
    </div>

</div>


<div class="nav">

    <div id="historyBtn">

        <b>◷</b>

        历史记录

    </div>


    <div id="settingsBtn">

        <b>⚙</b>

        设置

    </div>

</div>

</header>



<div class="grid">


<!-- ===================================================
     左侧
=================================================== -->

<section>


<div class="panel pad">

<h2>
    你的问题
</h2>


<textarea
    id="q"
    maxlength="500"
    placeholder="请详细描述你想占卜的问题……"
></textarea>


<div class="actions">

<button
    class="btn"
    id="begin"
>
    ✦ 开始大衍筮法
</button>


<button
    class="btn alt"
    id="restart"
>
    重新起卦
</button>

</div>


<p class="hint">

大衍之数五十，其用四十有九。<br>

每一爻三变，六爻成象。<br>

将真实展示：
分二 → 挂一 → 揲四 → 归奇 → 三变成爻。

</p>

</div>



<div class="panel stage">


<div
    class="stage-title"
    id="stageTitle"
>
    准备大衍之数
</div>


<div
    class="stage-desc"
    id="stageDesc"
>
    天地之数五十，虚一不用。
</div>


<div class="progress">

    <i id="bar"></i>

</div>


<div
    class="pile-area"
    id="piles"
></div>


<div
    class="choice"
    id="choice"
></div>


<div
    class="counts"
    id="counts"
></div>


<div
    class="remainders"
    id="remainders"
></div>


<div
    class="result"
    id="result"
    style="display:none"
></div>


</div>

</section>



<!-- ===================================================
     右侧
=================================================== -->

<section>


<div class="panel pad">


<h2>
    六爻结果
</h2>


<div class="hexwrap">


<div>

<div
    class="hexname"
    id="bn"
>
    本卦
</div>

<div
    class="hex"
    id="bh"
></div>

</div>


<div>

<div
    class="hexname"
    id="cn"
>
    变卦
</div>

<div
    class="hex"
    id="ch"
></div>

</div>


</div>



<div class="table">


<div class="tr head">

<div>爻位</div>

<div>爻象</div>

<div>数值</div>

<div>状态</div>

</div>


<div id="rows"></div>


</div>



<div class="actions">

<button
    class="btn"
    id="ai"
    disabled
>
    ✦ 解读
</button>

</div>


<div
    class="status"
    id="status"
>
    完成六爻后才能进行 AI 解读。
</div>


<div id="answer"></div>


</div>



<!-- ===================================================
     API 设置
=================================================== -->

<div class="panel api">


<div>

<div>
    GLM API
</div>

<div
    class="status"
    id="keyStatus"
>
    未设置
</div>

</div>


<button
    class="btn alt"
    id="keyButton"
>
    设置
</button>


</div>



<div
    class="panel pad apiBox"
    id="keyBox"
>


<h2>
    GLM API Key
</h2>


<input
    id="key"
    type="password"
    autocomplete="off"
    placeholder="请输入智谱 API Key"
>


<button
    class="btn"
    id="saveKey"
>
    保存设置
</button>


<button
    class="btn alt"
    id="clearKey"
>
    清除 Key
</button>


</div>


</section>

</div>



<div class="footer">

WANGXING · 星河大衍筮法

</div>


</div>



<!-- ===================================================
     历史记录
=================================================== -->

<div
    class="modal"
    id="historyModal"
>


<div class="modal-card">


<div class="modal-head">


<h2 style="margin:0">

/* =====================================================

/* =====================================================
   状态
===================================================== */

let question = "";

let yaoIndex = 0;

let changeIndex = 0;

let stalks = 49;

let allYao = [];

let currentHistoryId = null;

let isCalculating = false;


/* =====================================================
   延迟
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   安全随机整数
===================================================== */

function randomInt(min,max){

    if(max < min)
        return min;

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


/* =====================================================
   四取余
===================================================== */

function remainder4(n){

    const r =
        n % 4;

    return r === 0
        ? 4
        : r;

}


/* =====================================================
   爻状态
===================================================== */

function yaoState(v){

    if(v === 6)
        return "老阴 · 动";

    if(v === 7)
        return "少阳 · 静";

    if(v === 8)
        return "少阴 · 静";

    if(v === 9)
        return "老阳 · 动";

    return "未知";

}


/* =====================================================
   正确计算卦名
   allYao:
   [初爻,二爻,三爻,四爻,五爻,上爻]

   初爻在数组第0位。
   不再 reverse。
===================================================== */

function hexName(lines){

    const bits =
        lines.map(
            v =>
                (
                    v === 7 ||
                    v === 9
                )
                    ? "1"
                    : "0"
        );


    const lowerBits =
        bits
        .slice(0,3)
        .join("");


    const upperBits =
        bits
        .slice(3,6)
        .join("");


    const lowerName =
        tri[lowerBits];

    const upperName =
        tri[upperBits];


    return (
        hex[
            upperName +
            lowerName
        ]
        ||
        "未知卦"
    );

}


/* =====================================================
   画卦
===================================================== */

function renderHex(
    target,
    lines
){

    target.innerHTML = "";


    for(
        let i = 5;
        i >= 0;
        i--
    ){

        const v =
            lines[i];


        const d =
            document.createElement(
                "div"
            );


        d.className =
            "line" +
            (
                v === 6 ||
                v === 9
                    ? " movingline"
                    : ""
            );


        if(
            v === 7 ||
            v === 9
        ){

            d.innerHTML =
                '<div class="solid"></div>';

        }else{

            d.innerHTML =
                '<div class="broken1"></div>' +
                '<div class="broken2"></div>';

        }


        target.appendChild(d);

    }

}


/* =====================================================
   六爻表
===================================================== */

function updateRows(){

    rows.innerHTML = "";


    allYao.forEach(
        (v,i)=>{

            const d =
                document.createElement(
                    "div"
                );


            d.className =
                "tr" +
                (
                    v === 6 ||
                    v === 9
                        ? " move"
                        : ""
                );


            d.innerHTML = `

                <div>
                    第${i+1}爻
                </div>

                <div>
                    ${
                        v === 7 ||
                        v === 9
                            ? "━━━"
                            : "━ ━"
                    }
                </div>

                <div>
                    ${v}
                </div>

                <div>
                    ${yaoState(v)}
                </div>

            `;


            rows.appendChild(d);

        }
    );

}


/* =====================================================
   筮草
===================================================== */

function createStalks(count){

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "stalk-visual";


    const displayCount =
        Math.min(
            Math.max(
                count,
                1
            ),
            49
        );


    for(
        let i=0;
        i<displayCount;
        i++
    ){

        const stalk =
            document.createElement(
                "span"
            );


        stalk.className =
            "stalk";


        stalk.style.transform =
            `rotate(${
                Math.random()*10-5
            }deg)`;


        stalk.style.animationDelay =
            `${Math.min(i*0.008,.4)}s`;


        wrapper.appendChild(
            stalk
        );

    }


    return wrapper;

}


/* =====================================================
   重置一变
===================================================== */

function resetChange(){

    changeIndex = 0;

}


/* =====================================================
   开始
===================================================== */

async function start(){

    if(isCalculating)
        return;


    question =
        q.value.trim();


    if(!question){

        alert(
            "请先输入你想占卜的问题。"
        );

        q.focus();

        return;

    }


    isCalculating = true;


    yaoIndex = 0;

    allYao = [];

    currentHistoryId = null;

    stalks = 49;


    begin.disabled = true;

    restart.disabled = false;

    ai.disabled = true;


    answer.textContent = "";

    rows.innerHTML = "";

    bh.innerHTML = "";

    ch.innerHTML = "";


    bn.textContent =
        "本卦";

    cn.textContent =
        "变卦";


    bar.style.width =
        "0%";


    status.textContent =
        "正在进行大衍筮法。";


    stageTitle.textContent =
        "大衍之数";


    stageDesc.textContent =
        "天地之数五十，虚一不用。";


    piles.innerHTML = `

        <div class="ritual">

            五十根蓍草

            <div class="ritual-sub">
                大衍之数五十
            </div>

        </div>

    `;


    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";

    result.style.display =
        "none";


    await wait(1000);


    piles.innerHTML = `

        <div class="ritual">

            虚一不用

            <div class="single-stalk"></div>

            <div class="ritual-sub">
                一蓍挂于旁，其用四十有九
            </div>

        </div>

    `;


    await wait(1100);


    startYao();

}


/* =====================================================
   开始一爻
===================================================== */

async function startYao(){

    stalks = 49;

    changeIndex = 0;


    if(yaoIndex > 0){

        /*
         * 下一爻重新取四十九蓍
         */
        stalks = 49;

    }


    piles.innerHTML = "";

    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";

    result.style.display =
        "none";


    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 起筮`;


    stageDesc.textContent =
        "重新取四十九蓍，先合置于前。";


    const combined =
        document.createElement(
            "div"
        );


    combined.className =
        "combined-pile";


    combined.innerHTML = `

        <div class="combined-title">
            四十九蓍 · 合置
        </div>

    `;


    combined.appendChild(
        createStalks(49)
    );


    combined.innerHTML += `

        <div class="pile-number">
            49 蓍
        </div>

        <div class="pile-hint">
            点击筮草，开始「分二」
        </div>

    );

}


/* =====================================================
   分二
   不再让用户选择左右。
   点击整体筮草后自动分二。
===================================================== */

async function beginSplit(){

    if(!isCalculating)
        return;


    choice.innerHTML = "";


    const total =
        stalks;


    /*
     * 左右至少各一根。
     */

    const left =
        randomInt(
            1,
            total-1
        );


    const right =
        total-left;


    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 第 ${changeIndex+1} 变 · 分二`;


    stageDesc.textContent =
        "四十九蓍合置后，自动分为左右两束，以象天地。";


    piles.innerHTML = "";


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "pile-row";


    const leftPile =
        document.createElement(
            "div"
        );


    leftPile.className =
        "pile";


    leftPile.innerHTML = `

        <div class="pile-title">
            左束
        </div>

    `;


    leftPile.appendChild(
        createStalks(left)
    );


    leftPile.innerHTML += `

        <div class="pile-number">
            ${left} 蓍
        </div>

    `;


    const rightPile =
        document.createElement(
            "div"
        );


    rightPile.className =
        "pile highlight";


    rightPile.innerHTML = `

        <div class="pile-title">
            右束
        </div>

    `;


    rightPile.appendChild(
        createStalks(right)
    );


    rightPile.innerHTML += `

        <div class="pile-number">
            ${right} 蓍
        </div>

        <div class="pile-hint">
            自动取一蓍挂一
        </div>

    `;


    row.appendChild(
        leftPile
    );

    row.appendChild(
        rightPile
    );


    piles.appendChild(
        row
    );


    await wait(1200);


    await hangOne(
        left,
        right
    );

}


/* =====================================================
   挂一
===================================================== */

async function hangOne(
    left,
    right
){

    const rightAfter =
        right - 1;

    const leftAfter =

    stageTitle.textContent =

}


/* =====================================================
   揲四
===================================================== */

async function performSuan(
    left,
    right
){

    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";


    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 第 ${changeIndex+1} 变 · 揲四`;


    stageDesc.textContent =
        "左右两束分别以四为数，取其余数，归奇。";


    piles.innerHTML = `

        <div class="ritual">

            揲四

            <div class="ritual-sub">
                左右两束分别四四相数……
            </div>

        </div>

    `;


    await wait(900);


    const leftRemainder =
        remainder4(left);


    const rightRemainder =
        remainder4(right);


    /*
     * 挂一 + 左余 + 右余
     *
     * 每变必去 5 或 9 根。
     */

    const returned =
        1 +
        leftRemainder +
        rightRemainder;


    /*
     * 安全校验：
     * 正常大衍每变只能去5或9根。
     */

    if(
        returned !== 5 &&
        returned !== 9
    ){

        console.error(
            "大衍计算异常",
            {
                stalks,
                left,
                right,
                leftRemainder,
                rightRemainder,
                returned
            }
        );


        throw new Error(
            "本变归奇计算异常，请重新起筮。"
        );

    }


    const before =
        stalks;


    const after =
        before -
        returned;


    /*
     * 三变后必须最终得到
     *
     * 24 / 28 / 32 / 36
     *
     * 对应
     *
     * 6 / 7 / 8 / 9
     */

    stalks =
        after;


    changeIndex++;


    piles.innerHTML = `

        <div class="process-box">

            <div class="process-title">
                揲四 · 归奇
            </div>

            <div class="process-line">
                <span>
                    本变开始
                </span>

                <strong>
                    ${before} 蓍
                </strong>
            </div>

            <div class="process-line">
                <span>
                    左束
                </span>

                <strong>
                    ${left} 蓍
                </strong>
            </div>

            <div class="process-line">
                <span>
                    左余
                </span>

                <strong>
                    ${leftRemainder}
                </strong>
            </div>

            <div class="process-line">
                <span>
                    右束
                </span>

                <strong>
                    ${right} 蓍
                </strong>
            </div>

            <div class="process-line">
                <span>
                    右余
                </span>

                <strong>
                    ${rightRemainder}
                </strong>
            </div>

            <div class="process-line">
                <span>
                    挂一
                </span>

                <strong>
                    1
                </strong>
            </div>

            <div class="process-line">
                <span>
                    本变归奇
                </span>

                <strong>
                    ${returned}
                </strong>
            </div>

            <div class="process-line">
                <span>
                    本变之后
                </span>

                <strong>
                    ${after} 蓍
                </strong>
            </div>

        </div>

    `;


    counts.innerHTML = `

        <div class="countbox">

            左余

            <strong>
                ${leftRemainder}
            </strong>

        </div>


        <div class="countbox">

            右余

            <strong>
                ${rightRemainder}
            </strong>

        </div>

    `;


    remainders.innerHTML = `

        <div class="r">
            挂一 <b>1</b>
        </div>

        <div class="r">
            左余 <b>${leftRemainder}</b>
        </div>

        <div class="r">
            右余 <b>${rightRemainder}</b>
        </div>

        <div class="r">
            归奇 <b>${returned}</b>
        </div>

        <div class="r">
            余蓍 <b>${after}</b>
        </div>

    `;


    await wait(1100);


    if(
        changeIndex < 3
    ){

        choice.innerHTML = `

            <div class="choice-title">
                第 ${changeIndex} 变完成
            </div>

            <button
                class="choice-btn"
                id="nextChange"
            >
                进入第 ${changeIndex+1} 变
            </button>

        `;


        $("nextChange").onclick =
            ()=>{
                beginNextChange();
            };


        return;

    }


    finishYao();

}


/* =====================================================
   下一变
===================================================== */

async function beginNextChange(){

    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";

    result.style.display =
        "none";


    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 第 ${changeIndex+1} 变`;


    stageDesc.textContent =
        `上一变归奇后余 ${stalks} 蓍，重新分二。`;


    piles.innerHTML = `

        <div class="combined-pile">

            <div class="combined-title">
                余蓍重新合置
            </div>

        </div>

    `;


    const combined =
        piles.querySelector(
            ".combined-pile"
        );


    combined.appendChild(
        createStalks(stalks)
    );


    combined.innerHTML += `

        <div class="pile-number">
            ${stalks} 蓍
        </div>

        <div class="pile-hint">
            点击筮草，继续「分二」
        </div>

    `;


    combined.onclick =
        beginSplit;


}


/* =====================================================
   三变成爻
===================================================== */

async function finishYao(){

    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 三变成爻`;


    stageDesc.textContent =
        "三变已毕，以余蓍数除四，定六、七、八、九。";


    const remaining =
        stalks;


    const value =
        remaining / 4;


    /*
     * 正常三变结果：
     *
     * 24 → 6 老阴
     * 28 → 7 少阳
     * 32 → 8 少阴
     * 36 → 9 老阳
     */

    if(
        ![
            6,
            7,
            8,
            9
        ].includes(value)
    ){

        console.error(
            "三变异常",
            {
                yaoIndex,
                stalks,
                changeIndex,
                allYao
            }
        );


        isCalculating = false;

        alert(
            "本爻三变计算异常：" +
            "\n余蓍 = " +
            remaining +
            "\n结果 = " +
            value +
            "\n\n正常结果只能是 6、7、8、9。\n\n请重新起筮。"
        );


        reset();

        return;

    }


    allYao.push(
        value
    );


    result.style.display =
        "block";


    result.innerHTML = `

        <div class="ritual">
            三变成爻
        </div>

        <div class="num">
            ${value}
        </div>

        <div class="name">
            ${yaoState(value)}
        </div>

        <div class="process-box">

            <div class="process-line">
                <span>
                    三变后余蓍
                </span>

                <strong>
                    ${remaining}
                </strong>
            </div>

            <div class="process-line">
                <span>
                    除以四
                </span>

                <strong>
                    ${remaining} ÷ 4 = ${value}
                </strong>
            </div>

        </div>

    `;


    updateRows();


    yaoIndex++;


    bar.style.width =
        `${yaoIndex/6*100}%`;


    if(
        yaoIndex < 6
    ){

        await wait(1300);


        piles.innerHTML = "";

        choice.innerHTML = "";

        counts.innerHTML = "";

        remainders.innerHTML = "";

        result.style.display =
            "none";


        stageTitle.textContent =
            `第 ${yaoIndex+1} 爻 · 准备`;


        stageDesc.textContent =
            "重新取四十九蓍，准备下一爻。";


        await wait(600);


        startYao();

        return;

    }


    finishHexagram();

}

/* =====================================================
   保存历史
===================================================== */

function createHistory(item){

    const history =
        getHistory();


    const id =
        Date.now().toString() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2);


    item.id =
        id;


    history.unshift(
        item
    );


    const limited =
        history.slice(
            0,
            30
        );


    localStorage.setItem(
        "wangxing_history",
        JSON.stringify(
            limited
        )
    );


    return id;

}


/* =====================================================
   更新历史中的 AI 解读
===================================================== */

function updateHistoryAnswer(
    id,
    text
){

    const history =
        getHistory();


    const index =
        history.findIndex(
            x =>
                x.id === id
        );


    if(index === -1)
        return;


    history[index].answer =
        text;


    history[index].answerTime =
        new Date()
        .toLocaleString(
            "zh-CN"
        );


    localStorage.setItem(
        "wangxing_history",
        JSON.stringify(
            history
        )
    );

}


/* =====================================================

function escapeHtml(s){

    return String(s)
        .replace(
            /[&<>'"]/g,
            c =>
                ({
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    "'":"&#39;",
                    '"':"&quot;"
                }[c])
        );

}

/* =====================================================
   API 请求
===================================================== */

/*
 * 重要：
 *
 * 每个网页都有自己独立的 AbortController。
 *
 * 不使用全局 controller。
 *
 * 因此多个 WANGXING 页面同时请求时，
 * 一个页面的超时不会取消另一个页面。
 */


/* =====================================================
   sleep
===================================================== */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   单次 API 请求
===================================================== */

async function fetchWithTimeout(
    url,
    options,
    timeout
){

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            ()=>{
                controller.abort();
            },
            timeout
        );


    try{

        return await fetch(
            url,
            {
                ...options,
                signal:
                    controller.signal
            }
        );

    }finally{

        clearTimeout(
            timer
        );

    }

}


/* =====================================================
   API 错误解析
===================================================== */

async function parseApiResponse(
    response
){

    const raw =
        await response.text();


    let data =
        null;


    try{

        data =
            raw
                ? JSON.parse(raw)
                : null;

    }catch(e){

        data =
            null;

    }


    if(
        !response.ok
    ){

        const message =
            data?.error?.message ||
            data?.error?.msg ||
            data?.message ||
            data?.msg ||
            raw ||
            `HTTP ${response.status}`;


        const text =
            String(message);


        if(
            response.status === 401 ||
            response.status === 403 ||
            /invalid.*api.?key/i.test(text) ||
            /api.?key.*invalid/i.test(text) ||
            /unauthorized/i.test(text) ||
            /authentication/i.test(text)
        ){

            throw new Error(
                "API Key 无效或认证失败，请检查智谱 API Key。"
            );

        }


        if(
            response.status === 429 ||
            /rate.?limit/i.test(text) ||
            /too many/i.test(text) ||
            /quota/i.test(text)
        ){

            const error =
                new Error(
                    "API 当前请求过多或额度受限。"
                );

            error.retryable =
                true;

            error.rateLimited =
                true;

            throw error;

        }


        if(
            response.status >= 500 &&
            response.status <= 599
        ){

            const error =
                new Error(
                    "智谱服务器暂时异常（HTTP " +
                    response.status +
                    "）。"
                );

            error.retryable =
                true;

            throw error;

        }


        throw new Error(
            "智谱 API 请求失败：" +
            text
        );

    }


    if(!data){

        throw new Error(
            "智谱 API 返回为空。"
        );

    }


    return data;

}


/* =====================================================
   稳定 API 请求
===================================================== */

async function callGLM(
    apiKey,
    messages
){

    const url =
        "https://open.bigmodel.cn/api/paas/v4/chat/completions";


    /*
     * 3 次尝试。
     *
     * 每次独立超时。
     *
     * 第一次 45 秒
     * 第二次 60 秒
     * 第三次 75 秒
     *
     * 多网页同时打开时不会共享 controller。
     */

    const timeouts =
        [
            45000,
            60000,
            75000
        ];


    let lastError =
        null;


    for(
        let attempt = 0;
        attempt < 3;
        attempt++
    ){

        try{

            const response =
                await fetchWithTimeout(
                    url,
                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                apiKey

                        },

                        body:
                            JSON.stringify({

                                model:
                                    "glm-5.2",

                                messages:

                                    messages,

                                temperature:
                                    0.3,

                                max_tokens:
                                    3000,

                                stream:
                                    false

                            })

                    },

                    timeouts[
                        attempt
                    ]
                );


            return await parseApiResponse(
                response
            );


        }catch(error){

            lastError =
                error;


            /*
             * 用户 Key / 权限 / 参数错误
             * 不应该继续重试。
             */

            if(
                !error.retryable &&
                !(
                    error.name ===
                    "AbortError"
                )
            ){

                /*
                 * 网络错误没有 retryable，
                 * 仍然允许继续重试。
                 */

                const isNetworkError =
                    error instanceof
                        TypeError ||
                    /network/i.test(
                        error.message ||
                        ""
                    );


                if(!isNetworkError){

                    throw error;

                }

            }


            if(
                attempt < 2
            ){

                /*
                 * 指数退避 + 随机抖动
                 *
                 * 防止多个页面同时
                 * 重试形成请求洪峰。
                 */

                const base =
                    1500 *
                    Math.pow(
                        2,
                        attempt
                    );


                const jitter =
                    Math.random() *
                    1000;


                await sleep(
                    base +
                    jitter
                );

            }

        }

    }


    if(
        lastError?.name ===
        "AbortError"
    ){

        throw new Error(
            "请求连续超时。请检查网络、API 服务状态或 API 额度后再试。"
        );

    }


    throw new Error(
        "连续请求失败：" +
        (
            lastError?.message ||
            "网络连接异常"
        )
    );

}

async function requestAI(){

    const apiKey =
        localStorage.getItem(
            "wangxing_glm_key"
        );


    if(!apiKey){

        keyBox.style.display =
            "block";


        answer.textContent =

        return;

    }


    if(
        allYao.length !== 6
    ){

        answer.textContent =
            "请先完成六爻起卦。";


        return;

    }


    const changed =
        allYao.map(
            v=>{

                if(v === 6)
                    return 7;

                if(v === 9)
                    return 8;

                return v;

            }
        );


    const ben =
        hexName(
            allYao
        );


    const chg =
        hexName(
            changed
        );


    const moving =
        allYao
        .map(
            (v,i)=>
                (
                    v === 6 ||
                    v === 9
                )
                    ? `第${i+1}爻`
                    : null
        )
        .filter(Boolean);


    const prompt = `

用户问题：

${question}


本卦：

${ben}


变卦：

${chg}


六爻：

${allYao.join("、")}


动爻：

${
    moving.length
        ? moving.join("、")
        : "无"
}


请严格围绕用户提出的问题进行传统六爻 / 大衍筮法解读。

【最重要要求】

第一句话必须直接回答用户的问题。

例如：

“此卦整体偏向可以。”
“此卦整体偏向不利。”
“此卦显示有条件成立。”
“此卦目前难以成立。”
“此卦不足以判断具体时间，但趋势偏向……”

不能先讲一大段卦象知识再回答问题。


【解读规则】

1. 第一段直接给出针对用户问题的结论。

2. 明确判断属于：
   有利 / 不利 / 有条件成立 / 难以成立 / 信息不足。

3. 必须围绕用户真正询问的事情。

4. 本卦：
   解释事情目前的状态。

5. 动爻：
   如果存在动爻，重点分析与用户问题直接相关的动爻。

6. 变卦：
   判断事情最终趋势。

7. 如果用户问“什么时候”，可以根据卦象给出大致时间趋势，但不能虚构精确日期。

8. 如果用户问“有没有其他人”“是否会发生”“能不能成功”“是否能拿到 offer”“什么时候联系”等问题，必须直接回答对应问题。

9. 不要把占卜描述为百分之百确定的现实事实。

10. 如果卦象不足以支持精确判断，要明确写：
   “卦象不足以判断这一点。”
   但仍然给出目前最主要的趋势。

11. 不要主动扩展用户没有询问的问题。

12. 不要泛泛进行人生指导。

13. 不要用：
   “建议你……”
   “你可以考虑……”
   “建议保持……”
   来代替预测。

14. 重点是：
   卦象 → 对用户问题的指向 → 结论。

15. 不需要解释无关的基础易学知识。

16. 如果存在动爻，请说明：
   动爻为什么会影响这个问题。

17. 最后给出一个非常简短的：
   【最终判断】
   直接回答用户问题。

请使用中文回答。

`;


    ai.disabled =
        true;


    ai.textContent =
        "正在解读……";


    answer.textContent =
        "正在连接 GLM……";


    status.textContent =
        "正在请求 AI，网络异常会自动重试。";


    try{

        const data =
            await callGLM(
                apiKey,
                [

                    {

                        role:"system",

                        content:
                            "你是专业的传统大衍筮法与六爻解卦助手。必须严格围绕用户问题回答，第一段直接给出结论，不主动给泛泛人生建议。"

                    },

                    {

                        role:"user",

                        content:
                            prompt

                    }

                ]
            );


        const text =
            data
                ?.choices?.[0]
                ?.message
                ?.content;


        if(!text){

            throw new Error(

            );

        }


        answer.textContent =

        status.textContent =

        /*

         */

        if(currentHistoryId){

            updateHistoryAnswer(
                currentHistoryId,

            );

        }


    }catch(error){

        console.error(
            "GLM request error:",

        );


        answer.textContent =

                "未知错误"
            );


        status.textContent =
            "GLM AI 解读失败。";


    }finally{

        ai.disabled =
            false;


        ai.textContent =
            "✦ 解读";

    }

}

/* =====================================================
   星空
===================================================== */

const stars =
    $("stars");


const ctx =
    stars.getContext(
        "2d"
    );


let ss = [];


function resize(){

    const dpr =
        window.devicePixelRatio ||
        1;


    stars.width =
        innerWidth *
        dpr;


    stars.height =
        innerHeight *
        dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ss =
        Array.from(
            {
                length:
                    Math.floor(
                        innerWidth *
                        innerHeight /
                        7000
                    )
            },
            ()=>({

                x:
                    Math.random() *
                    innerWidth,

                y:
                    Math.random() *
                    innerHeight,

                r:
                    .2 +
                    Math.random() *
                    1.2,

                a:
                    .2 +
                    Math.random() *
                    .8,

                speed:
                    .05 +
                    Math.random() *
                    .25,

                twinkle:
                    Math.random() *
                    Math.PI *
                    2

            })
        );

}


function draw(){

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );


    const time =
        Date.now() *
        0.001;


    ss.forEach(
        s=>{

            const alpha =
                Math.max(
                    .12,
                    Math.min(
                        1,
                        s.a +
                        Math.sin(
                            time *
                            s.speed +
                            s.twinkle
                        ) *
                        .15
                    )
                );


            ctx.beginPath();


            ctx.arc(
                s.x,
                s.y,
                s.r,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `rgba(
                    180,
                    255,
                    255,
                    ${alpha}
                )`;


            ctx.fill();

        }
    );


    requestAnimationFrame(
        draw
    );

}


addEventListener(
    "resize",
    resize
);


resize();

draw();

</script>
