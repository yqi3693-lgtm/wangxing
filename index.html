/* =====================================================

===================================================== */

let question = "";

/*
 * 大衍筮法：

 * 五十蓍

let stalks = 49;

let allYao = [];

/*
 * 保存当前六爻最终数据

let currentHexData = null;


/* =====================================================
   延时
===================================================== */

function wait(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


/* =====================================================
   随机整数
===================================================== */

function randomInt(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


/* =====================================================
   揲四
===================================================== */

/*
 * 传统揲四：
 *
 * n % 4 === 0
 * 则余数按 4 计。
 *
 * 例如：
 *
 * 17 → 余 1
 * 18 → 余 2
 * 19 → 余 3
 * 20 → 余 4
 */

function remainder4(n){

    const r = n % 4;

    return r === 0
        ? 4
        : r;

}


/* =====================================================
   爻状态
===================================================== */

function yaoState(v){

    switch(v){

        case 6:
            return "老阴 · 动";

        case 7:
            return "少阳 · 静";

        case 8:
            return "少阴 · 静";

        case 9:
            return "老阳 · 动";

        default:
            return "未知";

    }

}


/* =====================================================
   六十四卦名称
===================================================== */

function hexName(lines){

    /*
     * lines[0] = 初爻
     * lines[5] = 上爻
     *
     * 八卦从下往上排列。
     */

    const lower =
        lines
        .slice(0,3)
        .map(v =>
            (
                v === 7 ||
                v === 9
            )
                ? "1"
                : "0"
        )
        .join("");


    const upper =
        lines
        .slice(3,6)
        .map(v =>
            (
                v === 7 ||
                v === 9
            )
                ? "1"
                : "0"
        )
        .join("");


    const lowerName =
        tri[lower];

    const upperName =
        tri[upper];


    return (
        hex[upperName + lowerName]
        ||
        "未知卦"
    );

}


/* =====================================================
   画卦
===================================================== */

function renderHex(target,lines){

    target.innerHTML = "";


    /*
     * 从上爻画到初爻
     */
    for(let i=5;i>=0;i--){

        const v =
            lines[i];


        const d =
            document.createElement("div");


        d.className =
            "line" +
            (
                v === 6 ||
                v === 9
                    ? " movingline"
                    : ""
            );


        if(
            v === 7 ||
            v === 9
        ){

            d.innerHTML =
                '<div class="solid"></div>';

        }else{

            d.innerHTML =
                '<div class="broken1"></div>' +
                '<div class="broken2"></div>';

        }


        target.appendChild(d);

    }

}


/* =====================================================
   六爻表
===================================================== */

function updateRows(){

    rows.innerHTML = "";


    allYao.forEach((v,i)=>{

        const d =
            document.createElement("div");


        d.className =
            "tr" +
            (
                v === 6 ||
                v === 9
                    ? " move"
                    : ""
            );


        d.innerHTML = `

            <div>
                第${i+1}爻
            </div>

            <div>
                ${
                    v === 7 ||
                    v === 9
                        ? "━━━"
                        : "━ ━"
                }
            </div>

            <div>
                ${v}
            </div>

            <div>
                ${yaoState(v)}
            </div>

        `;


        rows.appendChild(d);

    });

}


/* =====================================================
   筮草视觉
===================================================== */

function createStalks(count){

    const wrapper =
        document.createElement("div");


    wrapper.className =
        "stalk-visual";


    /*
     * 页面不一次渲染超过49根。
     */
    const displayCount =
        Math.min(
            Math.max(count,1),
            49
        );


    for(
        let i=0;
        i<displayCount;
        i++
    ){

        const stalk =
            document.createElement("span");


        stalk.className =
            "stalk";


        stalk.style.transform =
            `rotate(${
                Math.random()*10-5
            }deg)`;


        wrapper.appendChild(stalk);

    }


    return wrapper;

}


/* =====================================================
   显示筮草束
===================================================== */

function renderTwoPiles(
    left,
    right,
    clickable = false
){

    piles.innerHTML = "";


    const row =
        document.createElement("div");


    row.className =
        "pile-row";


    const leftPile =
        document.createElement("div");


    leftPile.className =
        "pile" +
        (
            clickable
                ? " clickable"
                : ""
        );


    leftPile.innerHTML = `

        <div class="pile-title">
            左束
        </div>

    `;


    leftPile.appendChild(
        createStalks(left)
    );


    leftPile.innerHTML += `

        <div class="pile-number">
            ${left} 蓍
        </div>

    `;


    const rightPile =
        document.createElement("div");


    rightPile.className =
        "pile" +
        (
            clickable
                ? " clickable"
                : ""
        );


    rightPile.innerHTML = `

        <div class="pile-title">
            右束
        </div>

    `;


    rightPile.appendChild(
        createStalks(right)
    );


    rightPile.innerHTML += `

        <div class="pile-number">
            ${right} 蓍
        </div>

    `;


    row.appendChild(leftPile);

    row.appendChild(rightPile);

    piles.appendChild(row);


    return {
        leftPile,
        rightPile
    };

}

   开始
===================================================== */

/* =====================================================
   开始一爻
===================================================== */

async function startYao(){

    stalks = 49;

    changeIndex = 0;

    currentChange = null;


    piles.innerHTML = "";

    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";

/* =====================================================
   分二
===================================================== */

async function beginChange(){

    /*
     * 当前蓍草总数
     *
     * 第一变：49
     * 第二变：经过第一次归奇后
     * 第三变：经过第二次归奇后
     */


    const total =
        stalks;


    /*
     * 分二：
     *
     * 将蓍草随机分成左右两束。
     *
     * 每束至少一根。
     */

    const left =
        randomInt(
            1,
            total-1
        );


    const right =
        total-left;


    currentChange = {

        before:total,

        left,

        right,

        hangSide:"right",

        hang:1,

        leftAfterHang:left,

        rightAfterHang:right-1,

        leftRemainder:null,

        rightRemainder:null,

        returned:null,

        after:null

    };


    /*
     * 传统“挂一”：
     *
     * 从右手一束取一根。
     *
     * 不再让用户选择左右。
     */


    currentChange.rightAfterHang =
        right - 1;


    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 第 ${changeIndex+1} 变`;


    stageDesc.textContent =
        "分而为二。天地既分，左右成束。";


    const visual =
        renderTwoPiles(
            left,
            right,
            false
        );


    await wait(1300);


    await performHangOne();

}

/* =====================================================
   揲四归奇
===================================================== */

async function performSuan(){

    const c =
        currentChange;


    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";


    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 第 ${changeIndex+1} 变 · 揲四`;


    stageDesc.textContent =
        "左右两束分别以四根为一组，余数归奇。";


    /*
     * 动画阶段
     */

    piles.innerHTML = `

        <div class="ritual">

            揲四

            <div class="ritual-sub">
                左右两束分别揲四……
            </div>

        </div>

    `;


    await wait(1100);


    /*
     * 左束余数
     */

    const leftRemainder =
        remainder4(
            c.leftAfterHang
        );


    /*
     * 右束余数
     */

    const rightRemainder =
        remainder4(
            c.rightAfterHang
        );


    /*
     * 归奇：
     *
     * 挂一 + 左余 + 右余
     */

    const returned =
        1 +
        leftRemainder +
        rightRemainder;


    const before =
        c.before;


    const after =
        before -
        returned;


    /*
     * 记录本变
     */

    c.leftRemainder =
        leftRemainder;

    c.rightRemainder =
        rightRemainder;

    c.returned =
        returned;

    c.after =
        after;


    /*
     * 更新蓍草总数
     */

    stalks =
        after;


    /*
     * 第几变
     */

    changeIndex++;


    /*
     * 显示结果
     */

    piles.innerHTML = "";

    const process =
        document.createElement("div");


    process.className =
        "process-box";


    process.innerHTML = `

        <div class="process-title">
            揲四 · 归奇
        </div>

        <div class="process-line">
            <span>本变开始</span>
            <strong>
                ${before} 蓍
            </strong>
        </div>

        <div class="process-line">
            <span>分二后左束</span>
            <strong>
                ${c.leftAfterHang} 蓍
            </strong>
        </div>

        <div class="process-line">
            <span>分二后右束</span>
            <strong>
                ${c.rightAfterHang} 蓍
            </strong>
        </div>

        <div class="process-line">
            <span>左余</span>
            <strong>
                ${leftRemainder}
            </strong>
        </div>

        <div class="process-line">
            <span>右余</span>
            <strong>
                ${rightRemainder}
            </strong>
        </div>

        <div class="process-line">
            <span>挂一</span>
            <strong>
                1
            </strong>
        </div>

        <div class="process-line">
            <span>归奇</span>
            <strong>
                ${returned}
            </strong>
        </div>

        <div class="process-line">
            <span>本变之后</span>
            <strong>
                ${after} 蓍
            </strong>
        </div>

    `;


    piles.appendChild(process);


    /*
     * 数字信息
     */

    counts.innerHTML = `

        <div class="countbox">

            左余

            <strong>
                ${leftRemainder}
            </strong>

        </div>

        <div class="countbox">

            右余

            <strong>
                ${rightRemainder}
            </strong>

        </div>

    `;


    remainders.innerHTML = `

        <div class="r">
            挂一 <b>1</b>
        </div>

        <div class="r">
            左余 <b>${leftRemainder}</b>
        </div>

        <div class="r">
            右余 <b>${rightRemainder}</b>
        </div>

        <div class="r">
            归奇 <b>${returned}</b>
        </div>

        <div class="r">
            余蓍 <b>${after}</b>
        </div>

    `;


    /*
     * 显示剩余蓍草
     */

    const remainingBox =
        document.createElement("div");


    remainingBox.className =
        "pile";


    remainingBox.style.marginTop =
        "14px";


    remainingBox.innerHTML = `

        <div class="pile-title">
            归奇之后
        </div>

    `;


    remainingBox.appendChild(
        createStalks(after)
    );


    remainingBox.innerHTML += `

        <div class="pile-number">
            ${after} 蓍
        </div>

    `;


    piles.appendChild(
        remainingBox
    );


    await wait(1500);


    /*
     * 三变完成
     */

    if(changeIndex < 3){

        choice.innerHTML = `

            <div class="choice-title">
                第 ${changeIndex} 变完成，
                余蓍重新合聚
            </div>

            <button
                class="choice-btn"
                id="nextChange"
            >
                重新分二 · 第 ${changeIndex+1} 变
            </button>

        `;


        $("nextChange").onclick =
            () => {

                beginChange();

            };


        return;

    }


    /*
     * 三变完成
     */

    finishYao();

}


/* =====================================================
   三变定爻
===================================================== */

async function finishYao(){

    const remaining =
        stalks;


    /*
     * 正统结果：
     *
     * 24 → 6 老阴
     * 28 → 7 少阳
     * 32 → 8 少阴
     * 36 → 9 老阳
     */

    const value =
        remaining / 4;


    /*
     * 安全校验
     */

    if(
        ![6,7,8,9].includes(value)
    ){

        alert(
            "本次三变演算出现异常：" +
            remaining +
            " 蓍。请重新起卦。"
        );


        reset();

        return;

    }


    allYao.push(value);


    result.style.display =
        "block";


    result.innerHTML = `

        <div class="ritual">
            三变成爻
        </div>

        <div class="num">
            ${value}
        </div>

        <div class="name">
            ${yaoState(value)}
        </div>

        <div class="process-box">

            <div class="process-line">
                <span>三变后余蓍</span>
                <strong>
                    ${remaining}
                </strong>
            </div>

            <div class="process-line">
                <span>除以四</span>
                <strong>
                    ${remaining} ÷ 4 = ${value}
                </strong>
            </div>

        </div>

    `;


    updateRows();


    yaoIndex++;


    bar.style.width =
        `${yaoIndex / 6 * 100}%`;


    /*
     * 六爻未完成
     */

    if(yaoIndex < 6){

        await wait(1700);


        piles.innerHTML = "";

        choice.innerHTML = "";

        counts.innerHTML = "";

        remainders.innerHTML = "";

        result.style.display =
            "none";


        stageTitle.textContent =
            `第 ${yaoIndex+1} 爻 · 准备`;


        stageDesc.textContent =
            "上一爻已成，重新取四十九蓍。";


        await wait(800);


        startYao();

        return;

    }


    /*
     * 六爻完成
     */

    finishHexagram();

}


/* =====================================================
   六爻成卦
===================================================== */

function finishHexagram(){

    const original =
        allYao.slice();


    /*
     * 老阴 6 → 阳 7
     * 老阳 9 → 阴 8
     *
     * 少阴、少阳不变
     */

    const changed =
        allYao.map(v=>{

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        });


    const ben =
        hexName(original);


    const chg =
        hexName(changed);


    const moving =
        allYao
        .map((v,i)=>
            (
                v === 6 ||
                v === 9
            )

function getHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "wangxing_history"
            ) || "[]"
        );

    }catch(e){

        return [];

    }

}


/* =====================================================
   保存历史
===================================================== */

function saveHistory(item){

    let history =
        getHistory();


    /*
     * 同一个问题 + 同一个时间不重复保存
     */

    history.unshift(item);


    history =
        history.slice(
            0,
            30
        );


    localStorage.setItem(
        "wangxing_history",
        JSON.stringify(history)
    );

}

                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"
            }[c])
        );

}

/* =====================================================
   GLM API 请求配置
===================================================== */

const GLM_ENDPOINT =
    "https://open.bigmodel.cn/api/paas/v4/chat/completions";


const GLM_MODEL =
    "glm-5.2";


/*
 * 单次请求最大等待时间
 *
 * 不要设置30秒以上。
 * 如果网络不好，20秒后进入重试。
 */

const API_TIMEOUT =
    20000;


/*
 * 最多尝试3次：
 *
 * 第1次
 * 第2次
 * 第3次
 *
 * 只有网络错误、超时、429、5xx 才自动重试。
 *
 * API Key 错误不会无限重试。
 */

const API_MAX_RETRIES =
    3;


/* =====================================================
   判断是否值得重试
===================================================== */

function shouldRetry(
    status,
    error
){

    /*
     * 网络错误
     */

    if(
        error &&
        (
            error.name === "TypeError" ||
            error.name === "AbortError"
        )
    ){

        return true;

    }


    /*
     * 429 限流
     */

    if(status === 429)
        return true;


    /*
     * 服务器错误
     */

    if(
        status >= 500 &&
        status <= 599
    ){

        return true;

    }


    return false;

}


/* =====================================================
   友好错误信息
===================================================== */

function getApiErrorMessage(
    status,
    data,
    raw
){

    const msg =
        data?.error?.message ||
        data?.message ||
        data?.error?.msg ||
        raw ||
        `HTTP ${status}`;


    const errorText =
        String(msg);


    /*
     * Key
     */

    if(
        /invalid.*api.?key/i.test(
            errorText
        ) ||
        /api.?key.*invalid/i.test(
            errorText
        ) ||
        /unauthorized/i.test(
            errorText
        ) ||
        /authentication/i.test(
            errorText
        ) ||
        status === 401
    ){

        return {
            type:"key",
            message:
                "API Key 无效或认证失败，请重新检查智谱 API Key。"
        };

    }


    /*
     * 权限
     */

    if(
        /permission/i.test(
            errorText
        ) ||
        /forbidden/i.test(
            errorText
        ) ||
        status === 403
    ){

        return {
            type:"permission",
            message:
                "当前 API Key 没有调用该模型的权限，请检查智谱账户及模型权限。"
        };

    }


    /*
     * 余额 / 配额
     */

    if(
        /insufficient/i.test(
            errorText
        ) ||
        /balance/i.test(
            errorText
        ) ||
        /余额/i.test(
            errorText
        ) ||
        /quota/i.test(
            errorText
        ) ||
        /quota exceeded/i.test(
            errorText
        )
    ){

        return {
            type:"quota",
            message:
                "智谱 API 余额或调用额度不足，请检查账户余额和 API 配额。"
        };

    }


    /*
     * 模型
     */

    if(
        (
            /model/i.test(
                errorText
            ) &&
            (
                /not found/i.test(
                    errorText
                ) ||
                /不存在/.test(
                    errorText
                ) ||
                /invalid/i.test(
                    errorText
                )
            )
        )
    ){

        return {
            type:"model",
            message:
                "GLM-5.2 模型不可用，请检查当前智谱账户是否支持该模型。"
        };

    }


    /*
     * 限流
     */

    if(status === 429){

        return {
            type:"retry",
            message:
                "请求过于频繁，正在自动重试。"
        };

    }


    /*
     * 服务器
     */

    if(status >= 500){

        return {
            type:"retry",
            message:
                "智谱服务器暂时繁忙，正在自动重试。"
        };

    }


    return {
        type:"other",
        message:
            "智谱 API 请求失败：" +
            errorText
    };

}


/* =====================================================
   等待重试
===================================================== */

async function retryWait(
    attempt
){

    /*
     * 1.5秒
     * 3秒
     *
     * 加一点随机时间，
     * 防止连续同时请求。
     */

    const base =
        attempt === 1
            ? 1500
            : 3000;


    const random =
        Math.floor(
            Math.random() * 500
        );


    const ms =
        base + random;


    status.textContent =
        `网络请求异常，${Math.ceil(ms/1000)}秒后自动重试……`;


    await wait(ms);

}


/* =====================================================
   构造 AI Prompt
===================================================== */

function buildPrompt(){

    const changed =
        allYao.map(v=>{

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        });


    const ben =
        hexName(allYao);


    const chg =
        hexName(changed);


    const moving =
        allYao
        .map((v,i)=>
            (
                v === 6 ||
                v === 9
            )
                ? `第${i+1}爻`
                : null
        )
        .filter(Boolean);


    return `

用户问题：

${question}


本卦：

${ben}


变卦：

${chg}


六爻：

${allYao.join("、")}


动爻：

${
    moving.length
        ? moving.join("、")
        : "无"
}


请严格围绕用户提出的问题进行六爻 / 大衍筮法解读。


要求：

1. 第一段直接回答用户的问题。

2. 明确说明结果偏向：
有利 / 不利 / 有条件成立 / 难以成立。

3. 结合本卦解释当前问题所处状态。

4. 有动爻时重点分析动爻。

5. 结合变卦判断最终趋势。

6. 如果卦象能够判断时间趋势，可以给出大致时间范围。

7. 只围绕用户实际提出的问题。

8. 不要泛泛扩展到人生、性格、感情、事业等用户没有询问的内容。

9. 不要把占卜结果描述成百分之百确定的现实事实。

10. 如果用户询问“是否会发生”“能不能”“什么时候”“有没有”“是否存在”等问题，必须直接回答。

11. 不要用“建议你”“你可以考虑”“建议保持”等方式代替预测结论。

12. 解读重点必须放在卦象对用户问题的指向。

13. 如果卦象不足以支持精确判断，应明确说“不足以精确判断”，同时给出最主要趋势。

14. 不需要解释你是 AI。

15. 不要重复用户问题。

16. 不要输出占卜免责声明式废话。

17. 结论必须放在最前面。

18. 如果用户的问题涉及具体对象、具体事件或具体时间，始终优先回答该对象、事件或时间。

`;

}


/* =====================================================
   单次 GLM 请求
===================================================== */

async function requestGLMSingle(
    apiKey,
    prompt
){

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            ()=>{
                controller.abort();
            },
            API_TIMEOUT
        );


    try{

        const response =
            await fetch(
                GLM_ENDPOINT,
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            apiKey

                    },

                    body:
                        JSON.stringify({

                            model:
                                GLM_MODEL,

                            messages:[

                                {

                                    role:"system",

                                    content:
                                        "你是专业的传统大衍筮法与六爻解卦助手。严格围绕用户问题回答，优先给出明确预测结论，不主动给泛泛人生建议。"

                                },

                                {

                                    role:"user",

                                    content:
                                        prompt

                                }

                            ],

                            temperature:
                                0.3,

                            max_tokens:
                                3000,

                            stream:
                                false

                        }),

                    signal:
                        controller.signal

                }

            );


        const raw =
            await response.text();


        let data =
            null;


        try{

            data =
                raw
                    ? JSON.parse(raw)
                    : null;

        }catch(e){

            if(
                !response.ok
            ){

                throw {
                    kind:"http",
                    status:
                        response.status,
                    raw
                };

            }


            throw new Error(
                "GLM 返回的数据格式异常。"
            );

        }


        if(!response.ok){

            throw {
                kind:"http",
                status:
                    response.status,
                data,
                raw
            };

        }


        const text =
            data?.choices?.[0]
                ?.message
                ?.content;


        if(!text){

            throw new Error(
                "GLM 没有返回解读内容。"
            );

        }


        return text;


    }finally{

        clearTimeout(
            timer
        );

    }

}


/* =====================================================
   GLM 请求：自动重试
===================================================== */

async function requestAIWithRetry(){

    const apiKey =
        localStorage.getItem(
            "wangxing_glm_key"
        );


    if(!apiKey){

        keyBox.style.display =
            "block";


        throw new Error(
            "请先设置智谱 GLM-5.2 API Key。"
        );

    }


    if(allYao.length !== 6){

        throw new Error(
            "请先完成六爻起卦。"
        );

    }


    const prompt =
        buildPrompt();


    let lastError =
        null;


    for(
        let attempt=1;
        attempt<=API_MAX_RETRIES;
        attempt++
    ){

        try{

            status.textContent =
                attempt === 1
                    ? "正在连接 GLM-5.2……"
                    : `正在进行第 ${attempt} 次请求……`;


            const text =
                await requestGLMSingle(
                    apiKey,
                    prompt
                );


            return text;


        }catch(e){

            lastError =
                e;


            /*
             * HTTP 错误
             */

            if(
                e?.kind === "http"
            ){

                const info =
                    getApiErrorMessage(
                        e.status,
                        e.data,
                        e.raw
                    );


                /*
                 * 只有网络/429/5xx重试。
                 *
                 * Key、权限、余额等错误
                 * 不重复请求。
                 */

                if(
                    (
                        e.status === 429 ||
                        e.status >= 500
                    ) &&
                    attempt < API_MAX_RETRIES
                ){

                    await retryWait(
                        attempt
                    );

                    continue;

                }


                throw new Error(
                    info.message
                );

            }


            /*
             * AbortError = 超时
             */

            if(
                e?.name === "AbortError"
            ){

                if(
                    attempt <
                    API_MAX_RETRIES
                ){

                    await retryWait(
                        attempt
                    );

                    continue;

                }


                throw new Error(
                    "连续3次请求均超过20秒，可能是网络连接不稳定或智谱接口暂时无法响应。"
                );

            }


            /*
             * TypeError：
             *
             * 浏览器 fetch 最常见的网络错误。
             *
             * 例如：
             *
             * Failed to fetch
             */

            if(
                e?.name === "TypeError"
            ){

                if(
                    attempt <
                    API_MAX_RETRIES
                ){

                    await retryWait(
                        attempt
                    );

                    continue;

                }


                throw new Error(
                    "连续3次网络请求失败。浏览器无法连接智谱 API，请检查网络、代理或接口跨域状态。"
                );

            }


            /*
             * 普通错误
             */

            throw e;

        }

    }


    throw lastError ||
        new Error(
            "GLM 请求失败。"
        );

}

    ){

        answer.textContent =
            "请先完成六爻起卦。";

        return;

    }


    const apiKey =
        localStorage.getItem(
            "wangxing_glm_key"
        );


    if(!apiKey){

        keyBox.style.display =
            "block";


        answer.textContent =
            "请先设置智谱 GLM-5.2 API Key。";


        return;

    }


    /*
     * 防止用户连续点击
     */

    ai.disabled =
        true;


    ai.textContent =
        "正在解读……";


    answer.textContent =
        "正在连接 GLM-5.2，请稍候……";


    try{

        const text =
            await requestAIWithRetry();


        answer.textContent =
            text;


        status.textContent =
            "GLM-5.2 AI 解读完成。";


        /*
         * 保存 AI 解读
         */

        updateLatestHistoryAnswer(
            text
        );


    }catch(e){

        const message =
            e?.message ||
            "未知错误";


        answer.textContent =
            "解读失败：" +
            message;


        status.textContent =
            "GLM-5.2 AI 解读失败。";


    }finally{

        ai.disabled =
            false;


        ai.textContent =
            "✦ 解读";

    }

}


ai.onclick =
    requestAI;


/* =====================================================
   星空背景
===================================================== */

const stars =
    $("stars");

const ctx =
    stars.getContext("2d");

let ss = [];


function resize(){

    stars.width =
        innerWidth *
        devicePixelRatio;


    stars.height =
        innerHeight *
        devicePixelRatio;


    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );


    ss =
        Array.from(
            {
                length:
                    Math.floor(
                        innerWidth *
                        innerHeight /
                        9000
                    )
            },
            ()=>({

                x:
                    Math.random() *
                    innerWidth,

                y:
                    Math.random() *
                    innerHeight,

                r:
                    .2 +
                    Math.random() *
                    1.2,

                a:
                    .2 +
                    Math.random() *
                    .8

            })
        );

}


function draw(){

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );


    ss.forEach(s=>{

        ctx.beginPath();


        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            `rgba(
                180,
                255,
                255,
                ${s.a}
            )`;


        ctx.fill();

    });


    requestAnimationFrame(
        draw
    );

}


addEventListener(
    "resize",
    resize
);


resize();

draw();

</script>
