<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WANGXING · 大衍筮法</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#01090c;
    color:#d9ffff;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}

body{
    overflow-x:hidden;
}

#stars{
    position:fixed;
    inset:0;
    z-index:0;
    background:#01090c;
}

.space{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
}

.nebula{
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(ellipse at 50% 10%,rgba(50,255,236,.38),transparent 24%),
        radial-gradient(ellipse at 15% 35%,rgba(0,180,220,.24),transparent 27%),
        radial-gradient(ellipse at 85% 45%,rgba(25,240,215,.20),transparent 25%),
        radial-gradient(ellipse at 45% 80%,rgba(0,120,180,.20),transparent 30%);
    filter:blur(20px);
    animation:drift 20s ease-in-out infinite alternate;
}

@keyframes drift{
    from{transform:scale(1)}
    to{transform:scale(1.08) translate(2%,-1%)}
}

.container{
    position:relative;
    z-index:2;
    max-width:1450px;
    margin:auto;
    padding:34px 42px 50px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:24px;
}

.logo{
    letter-spacing:.12em;
}

.en{
    font:32px Georgia,serif;
    color:#c1ffff;
}

.cn{
    font-size:29px;
    margin-top:5px;
}

.sub{
    margin-top:8px;
    font-size:12px;
    color:#689497;
}

.nav{
    display:flex;
    gap:28px;
    color:#78a7aa;
    font-size:12px;
}

.nav div{
    text-align:center;
    cursor:pointer;
}

.nav b{
    display:block;
    font-size:20px;
    font-weight:400;
    margin-bottom:4px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.panel{
    background:linear-gradient(
        145deg,
        rgba(3,29,35,.84),
        rgba(1,15,20,.78)
    );
    border:1px solid rgba(60,218,214,.42);
    border-radius:18px;
    box-shadow:
        0 0 35px rgba(23,203,202,.07),
        inset 0 0 30px rgba(67,240,233,.025);
    backdrop-filter:blur(10px);
}

.pad{
    padding:24px 28px;
}

h2{
    font-size:19px;
    font-weight:500;
    color:#aaf2ef;
    letter-spacing:.08em;
    margin:0 0 17px;
}

textarea{
    width:100%;
    height:108px;
    resize:none;
    outline:none;
    background:rgba(0,13,18,.72);
    border:1px solid #287b80;
    border-radius:11px;
    color:#d9ffff;
    padding:15px;
    font:15px "PingFang SC","Microsoft YaHei",sans-serif;
}

textarea:focus{
    border-color:#5be9e3;
    box-shadow:0 0 18px rgba(61,227,220,.13);
}

.actions{
    display:flex;
    gap:12px;
    margin-top:16px;
    flex-wrap:wrap;
}

.btn{
    border:1px solid #48d6d2;
    background:linear-gradient(180deg,#41c8c7,#169b9d);
    color:#efffff;
    border-radius:9px;
    padding:12px 20px;
    cursor:pointer;
    font:inherit;
    box-shadow:0 0 18px rgba(54,217,212,.14);
}

.btn.alt{
    background:transparent;
    color:#91babc;
    border-color:#286d72;
}

.btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.hint,
.status{
    font-size:12px;
    color:#638d90;
    line-height:1.8;
}

.stage{
    min-height:600px;
    margin-top:18px;
    padding:25px 22px;
}

.stage-title{
    text-align:center;
    color:#b2f5f1;
    font-size:19px;
    letter-spacing:.08em;
}

.stage-desc{
    text-align:center;
    color:#658f92;
    font-size:12px;
    line-height:1.8;
    min-height:43px;
    margin-top:7px;
}

.progress{
    height:5px;
    background:#08262a;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0;
}

.progress i{
    display:block;
    width:0;
    height:100%;
    background:#55dfda;
    box-shadow:0 0 12px #43e3dc;
    transition:.6s;
}

.pile-area{
    min-height:240px;
    margin:12px 0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.ritual{
    text-align:center;
    color:#c2ffff;
    font-size:16px;
    letter-spacing:.08em;
}

.ritual-sub{
    margin-top:8px;
    color:#638f92;
    font-size:11px;
    letter-spacing:.03em;
}

.single-stalk{
    width:5px;
    height:80px;
    margin:20px auto;
    border-radius:5px;
    background:linear-gradient(180deg,#efffff,#50d8d2);
    box-shadow:0 0 18px rgba(82,224,217,.65);
    animation:hang 1.2s ease forwards;
}

@keyframes hang{
    from{
        opacity:0;
        transform:translateY(-40px) rotate(-20deg);
    }
    to{
        opacity:1;
        transform:translateY(0) rotate(0);
    }
}

.pile-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.pile{
    min-height:220px;
    padding:17px;
    border:1px dashed #277276;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            ellipse,
            rgba(14,103,108,.23),
            rgba(0,25,30,.18) 60%,
            transparent 78%
        );
    transition:.3s;
}

.pile.clickable{
    cursor:pointer;
    border-color:#51dcd7;
    box-shadow:0 0 18px rgba(69,222,216,.10);
}

.pile.clickable:hover{
    transform:translateY(-3px);
    background:rgba(29,119,121,.20);
}

.pile-title{
    color:#8bbec0;
    font-size:13px;
    margin-bottom:9px;
}

.pile-number{
    font-size:26px;
    color:#c9ffff;
    margin-top:9px;
}

.pile-hint{
    color:#527f82;
    font-size:11px;
    margin-top:7px;
}

.stalk-visual{
    width:100%;
    max-width:270px;
    min-height:90px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:center;
    gap:3px;
    padding:10px;
    border-radius:12px;
    background:
        radial-gradient(
            ellipse,
            rgba(37,139,143,.17),
            rgba(1,23,28,.30)
        );
}

.stalk{
    width:3px;
    height:31px;
    display:block;
    border-radius:3px;
    background:linear-gradient(
        180deg,
        #dcffff,
        #52c9c5
    );
    opacity:.82;
    box-shadow:0 0 4px rgba(87,225,218,.35);
}

.process-box{
    width:100%;
    max-width:620px;
    margin:auto;
    border:1px solid #205c61;
    border-radius:13px;
    padding:18px;
    background:rgba(2,22,27,.65);
}

.process-title{
    text-align:center;
    color:#9dd6d7;
    font-size:13px;
    margin-bottom:14px;
}

.process-line{
    display:grid;
    grid-template-columns:1fr auto;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid #143b40;
    color:#719b9d;
    font-size:12px;
}

.process-line:last-child{
    border-bottom:0;
}

.process-line strong{
    color:#c8ffff;
    font-size:15px;
}

.choice{
    text-align:center;
    min-height:55px;
}

.choice-title{
    color:#7fa9ab;
    font-size:13px;
    margin-bottom:10px;
}

.choice-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.choice-btn{
    border:1px solid #317c80;
    background:#052329;
    color:#a7d8d9;
    border-radius:8px;
    padding:9px 15px;
    cursor:pointer;
}

.choice-btn:hover{
    border-color:#5be9e3;
    color:#dfffff;
}

.counts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:10px;
}

.countbox{
    border:1px solid #205a5f;
    border-radius:11px;
    padding:12px;
    text-align:center;
    color:#79a5a7;
}

.countbox strong{
    display:block;
    font-size:24px;
    color:#c5ffff;
    margin-top:5px;
}

.remainders{
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
    margin:13px 0;
}

.r{
    padding:8px 11px;
    border-radius:9px;
    background:#062329;
    border:1px solid #23686d;
    color:#8cb8ba;
}

.r b{
    color:#d4ffff;
}

.result{
    margin-top:15px;
    padding:16px;
    border:1px solid #245f64;
    border-radius:12px;
    background:rgba(1,22,27,.70);
    text-align:center;
}

.result .num{
    font-size:32px;
    color:#bafffa;
}

.result .name{
    font-size:15px;
    color:#7da9ab;
    margin-top:5px;
}

.hexwrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    margin-top:15px;
    text-align:center;
}

.hexname{
    color:#7ea9ab;
    font-size:13px;
    margin-bottom:11px;
}

.hex{
    display:flex;
    flex-direction:column;
    gap:7px;
    align-items:center;
}

.line{
    height:11px;
    width:150px;
    position:relative;
}

.solid,
.broken1,
.broken2{
    position:absolute;
    top:3px;
    height:6px;
    background:#5bdcd8;
    border-radius:5px;
    box-shadow:0 0 8px rgba(74,225,219,.2);
}

.solid{
    left:0;
    right:0;
}

.broken1{
    left:0;
    width:64px;
}

.broken2{
    right:0;
    width:64px;
}

.movingline .solid,
.movingline .broken1,
.movingline .broken2{
    background:#caffff;
}

.table{
    margin-top:18px;
    border:1px solid #20565b;
    border-radius:10px;
    overflow:hidden;
}

.tr{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    padding:9px 4px;
    border-bottom:1px solid #12383c;
    color:#789da0;
    font-size:12px;
    text-align:center;
}

.tr:last-child{
    border-bottom:0;
}

.tr.head{
    color:#94c1c2;
    background:rgba(30,101,105,.15);
}

.tr.move{
    background:rgba(59,205,201,.08);
    color:#c4eeee;
}

.api{
    margin-top:18px;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.apiBox{
    display:none;
    margin-top:8px;
}

.apiBox input{
    width:100%;
    background:#02161b;
    border:1px solid #28646a;
    border-radius:8px;
    color:white;
    padding:10px;
    outline:none;
}

.apiBox button{
    margin-top:8px;
}

#answer{
    white-space:pre-wrap;
    line-height:1.9;
    color:#c9eeee;
    min-height:80px;
    margin-top:15px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,8,12,.78);
    backdrop-filter:blur(8px);
    padding:30px;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-card{
    width:min(820px,100%);
    max-height:85vh;
    overflow:auto;
    background:#03171c;
    border:1px solid #3ed4d0;
    border-radius:18px;
    padding:24px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.history-item{
    border:1px solid #205a5f;
    border-radius:11px;
    padding:14px;
    margin:10px 0;
    cursor:pointer;
    background:rgba(3,31,37,.65);
}

.history-item:hover{
    border-color:#50ddd8;
}

.history-question{
    color:#c8ffff;
    margin-bottom:8px;
}

.history-meta{
    font-size:12px;
    color:#6f9da0;
    line-height:1.7;
}

.history-answer{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #153d41;
    color:#a9d8d9;
    white-space:pre-wrap;
    line-height:1.7;
}

.empty{
    color:#668f92;
    text-align:center;
    padding:30px;
}

.footer{
    text-align:center;
    color:#426b6e;
    font-size:11px;
    margin-top:22px;
}

@media(max-width:900px){

    .container{
        padding:22px 15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .nav{
        display:none;
    }
}

@media(max-width:560px){

    .hexwrap{
        grid-template-columns:1fr;
    }

    .pile-row{
        grid-template-columns:1fr;
    }

    .tr{
        font-size:11px;
    }

    .modal{
        padding:15px;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="space">
    <div class="nebula"></div>
</div>

<div class="container">

<header>

<div class="logo">
    <div class="en">WANGXING</div>
    <div class="cn">大衍筮法</div>
    <div class="sub">
        一问一卦 · 六爻成象 · 星河筮问
    </div>
</div>

<div class="nav">

    <div id="historyBtn">
        <b>◷</b>
        历史记录
    </div>

    <div id="settingsBtn">
        <b>⚙</b>
        设置
    </div>

</div>

</header>


<div class="grid">

<section>

<div class="panel pad">

<h2>你的问题</h2>

<textarea
id="q"
maxlength="500"
placeholder="请详细描述你想占卜的问题……"></textarea>

<div class="actions">

<button class="btn" id="begin">
    ✦ 开始大衍筮法
</button>

<button class="btn alt" id="restart">
    重新起卦
</button>

</div>

<p class="hint">
大衍之数五十，其用四十有九。
每一爻三变，六爻成卦。
过程中真实展示分二、挂一、揲四、归奇。
</p>

</div>


<div class="panel stage">

<div class="stage-title" id="stageTitle">
准备大衍之数
</div>

<div class="stage-desc" id="stageDesc">
天地之数五十，虚一不用。
</div>

<div class="progress">
    <i id="bar"></i>
</div>

<div class="pile-area" id="piles"></div>

<div class="choice" id="choice"></div>

<div class="counts" id="counts"></div>

<div class="remainders" id="remainders"></div>

<div class="result" id="result" style="display:none"></div>

</div>

</section>


<section>

<div class="panel pad">

<h2>六爻结果</h2>

<div class="hexwrap">

<div>

<div class="hexname" id="bn">
本卦
</div>

<div class="hex" id="bh"></div>

</div>

<div>

<div class="hexname" id="cn">
变卦
</div>

<div class="hex" id="ch"></div>

</div>

</div>


<div class="table">

<div class="tr head">
<div>爻位</div>
<div>爻象</div>
<div>数值</div>
<div>状态</div>
</div>

<div id="rows"></div>

</div>


<div class="actions">

<button class="btn" id="ai" disabled>
✦ 解读
</button>

</div>

<div class="status" id="status">
完成六爻后才能进行 AI 解读。
</div>

<div id="answer"></div>

</div>


<div class="panel api">

<div>

<div>GLM-5.2 API</div>

<div class="status" id="keyStatus">
未设置
</div>

</div>

<button class="btn alt" id="keyButton">
设置
</button>

</div>


<div class="panel pad apiBox" id="keyBox">

<h2>GLM-5.2 API Key</h2>

<input
id="key"
type="password"
autocomplete="off"
placeholder="请输入智谱 API Key">

<button class="btn" id="saveKey">
保存设置
</button>

<button class="btn alt" id="clearKey">
清除 Key
</button>

</div>

</section>

</div>


<div class="footer">
WANGXING · 星河大衍筮法
</div>

</div>


<div class="modal" id="historyModal">

<div class="modal-card">

<div class="modal-head">

<h2 style="margin:0">
历史记录
</h2>

<button class="btn alt" id="closeHistory">
关闭
</button>

</div>

<div id="historyList"></div>

</div>

</div>


<script>

/* =====================================================
   DOM
===================================================== */

const $ = id => document.getElementById(id);

const q = $("q");
const begin = $("begin");
const restart = $("restart");

const piles = $("piles");
const choice = $("choice");
const counts = $("counts");
const remainders = $("remainders");
const result = $("result");

const stageTitle = $("stageTitle");
const stageDesc = $("stageDesc");
const bar = $("bar");

const bn = $("bn");
const cn = $("cn");
const bh = $("bh");
const ch = $("ch");

const rows = $("rows");

const ai = $("ai");
const answer = $("answer");
const status = $("status");

const keyBox = $("keyBox");
const key = $("key");
const keyStatus = $("keyStatus");

const historyModal = $("historyModal");
const historyList = $("historyList");


/* =====================================================
   八卦
===================================================== */

const tri = {

    "111":"乾",
    "110":"兑",
    "101":"离",
    "100":"震",
    "011":"巽",
    "010":"坎",
    "001":"艮",
    "000":"坤"

};


/* =====================================================
   六十四卦
===================================================== */

const hex = {

"乾乾":"乾为天",
"坤坤":"坤为地",
"坎震":"水雷屯",
"艮坎":"山水蒙",
"坎乾":"水天需",
"乾坎":"天水讼",
"坤坎":"地水师",
"坎坤":"水地比",
"巽乾":"风天小畜",
"乾兑":"天泽履",
"坤乾":"地天泰",
"乾坤":"天地否",
"乾离":"天火同人",
"离乾":"火天大有",
"坤艮":"地山谦",
"震坤":"雷地豫",
"兑震":"泽雷随",
"艮巽":"山风蛊",
"坤兑":"地泽临",
"巽坤":"风地观",
"离震":"火雷噬嗑",
"艮离":"山火贲",
"艮坤":"山地剥",
"坤震":"地雷复",
"乾震":"天雷无妄",
"艮乾":"山天大畜",
"艮震":"山雷颐",
"兑巽":"泽风大过",
"坎坎":"坎为水",
"离离":"离为火",
"兑艮":"泽山咸",
"震巽":"雷风恒",
"乾艮":"天山遁",
"震乾":"雷天大壮",
"离坤":"火地晋",
"坤离":"地火明夷",
"巽离":"风火家人",
"离兑":"火泽睽",
"坎艮":"水山蹇",
"震坎":"雷水解",
"艮兑":"山泽损",
"巽震":"风雷益",
"兑乾":"泽天夬",
"乾巽":"天风姤",
"兑坤":"泽地萃",
"坤巽":"地风升",
"兑坎":"泽水困",
"坎巽":"水风井",
"兑离":"泽火革",
"离巽":"火风鼎",
"震震":"震为雷",
"艮艮":"艮为山",
"巽艮":"风山渐",
"震兑":"雷泽归妹",
"震离":"雷火丰",
"离艮":"火山旅",
"巽巽":"巽为风",
"兑兑":"兑为泽",
"巽坎":"风水涣",
"坎兑":"水泽节",
"巽兑":"风泽中孚",
"震艮":"雷山小过",
"坎离":"水火既济",
"离坎":"火水未济"

};


/* =====================================================
   状态
===================================================== */

let question = "";

let yaoIndex = 0;

let changeIndex = 0;

let stalks = 49;

let allYao = [];

let currentRound = null;

let isRunning = false;

let currentHistoryId = null;


/* =====================================================
   工具
===================================================== */

function wait(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}


/*
 * 揲四取余
 *
 * 余数为0时，按4计。
 */
function remainder4(n){

    const r = n % 4;

    return r === 0 ? 4 : r;
}


/*
 * 大衍筮法核心：
 *
 * 49
 * ↓
 * 分二
 * ↓
 * 挂一（固定从右束取一）
 * ↓
 * 左右揲四
 * ↓
 * 归奇
 *
 * 每变必然去掉5或9根。
 *
 * 三变之后必然得到：
 * 24 / 28 / 32 / 36
 *
 * 再 ÷ 4：
 * 6 / 7 / 8 / 9
 */
function calculateChange(total,left,right){

    const leftRemainder =
        remainder4(left);

    const rightRemainder =
        remainder4(right - 1);

    const returned =
        1 +
        leftRemainder +
        rightRemainder;

    const after =
        total - returned;

    return {
        total,
        left,
        right,
        hung:1,
        leftRemainder,
        rightRemainder,
        returned,
        after
    };
}

===================================================== */

function yaoState(v){

    if(v === 6)
        return "老阴 · 动";

    if(v === 7)
        return "少阳 · 静";

    if(v === 8)
        return "少阴 · 静";

    if(v === 9)
        return "老阳 · 动";

    return "未知";
}


/* =====================================================
   六十四卦名称
===================================================== */

function hexName(lines){

    const lower =
        lines
        .slice(0,3)
        .map(v =>
            (v === 7 || v === 9)
                ? "1"
                : "0"
        )
        .reverse()
        .join("");

    const upper =
        lines
        .slice(3,6)
        .map(v =>
            (v === 7 || v === 9)
                ? "1"
                : "0"
        )
        .reverse()
        .join("");

    const lowerName = tri[lower];
    const upperName = tri[upper];

    return hex[upperName + lowerName] || "未知卦";
}

async function performSuan(left,rightAfter){

    if(!currentRound)
        return;

    choice.innerHTML = "";
    counts.innerHTML = "";
    remainders.innerHTML = "";

    const total =
        currentRound.total;

    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 第 ${changeIndex+1} 变`;

        "左右两束分别揲四，余数归奇。";

    const data =
        calculateChange(
            total,
            left,
            currentRound.right
        );

     * 严格校验。
     */
    if(
        !Number.isInteger(data.after) ||
        data.after <= 0 ||
        data.after % 4 !== 0
    ){

            "大衍计算异常：",

            </div>

            <div class="process-line">
                <span>右余</span>
                <strong>${data.rightRemainder}</strong>
            </div>

            <div class="process-line">
                <span>挂一</span>
                <strong>1</strong>
            </div>

            <div class="process-line">
                <span>归奇</span>
                <strong>${data.returned}</strong>
            </div>

            <div class="process-line">
                <span>本变之后</span>
                <strong>${data.after} 蓍</strong>
            </div>

        </div>
    `;

    counts.innerHTML = `

        <div class="countbox">

            左余

            <strong>
                ${data.leftRemainder}
            </strong>

        </div>

        <div class="countbox">

            右余

            </strong>

    remainders.innerHTML = `

        </div>

            归奇 <b>${data.returned}</b>
        </div>

            余蓍 <b>${data.after}</b>

    await wait(1000);

    if(changeIndex < 3){

        choice.innerHTML = `

async function finishYao(){

    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 三变成爻`;

    stageDesc.textContent =
        "三变已毕，以余蓍数除以四，定其爻象。";

    const remaining =
        stalks;

    /*
     * 这里理论上只能出现：
     * 24 / 28 / 32 / 36
     */
    if(
        ![24,28,32,36].includes(remaining)
    ){

        console.error(
            "三变最终余蓍异常：",
            remaining
        );

        showCalculationError({
            after:remaining,
            reason:"三变后余蓍不是24、28、32、36"
        });

        return;
    }

    const value =
        remaining / 4;

    /*
     * 理论上只能是6/7/8/9。
     */
    if(
        ![6,7,8,9].includes(value)
    ){

        showCalculationError({
            after:remaining,
            value
        });

        return;
    }

    allYao.push(value);

    result.style.display =
        "block";

    result.innerHTML = `

        <div class="ritual">
            三变成爻
        </div>

        <div class="num">

            </div>

                <span>除以四</span>

            </div>

    updateRows();

    yaoIndex++;

    bar.style.width =

    if(yaoIndex < 6){

        piles.innerHTML = "";

        stageDesc.textContent =
            "上一爻已成，重新取四十九蓍。";

        await wait(600);

        startYao();

        return;
    }

    finishHexagram();
}

        allYao.slice();

        allYao.map(v=>{

            if(v === 9)

            return v;

        hexName(original);

    const chg =

            (

        `本卦 · ${ben}`;

        bh,
        original

/* =====================================================
   历史记录
===================================================== */

function getHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "wangxing_history"
            ) || "[]"
        );

    }catch(e){

        return [];
    }
}


function saveHistory(item){

    let history =
        getHistory();

    /*
     * 同一个卦象再次更新时，
     * 不新增重复记录。
     */
    const index =
        history.findIndex(
            x => x.id === item.id
        );

    if(index >= 0){

        history[index] = {
            ...history[index],
            ...item
        };

    }else{

        history.unshift(item);
    }

    history =
        history.slice(0,30);

    try{

        localStorage.setItem(
            "wangxing_history",
            JSON.stringify(history)
        );

    }catch(e){

        console.error(
            "历史记录保存失败：",
            e
        );
    }
}


function updateHistoryAnswer(
    id,
    text
){

    const history =
        getHistory();

    const index =
        history.findIndex(
            x => x.id === id
        );

    if(index < 0)
        return;

    history[index].answer =
        text;

    try{

        localStorage.setItem(
            "wangxing_history",
            JSON.stringify(history)
        );

    }catch(e){

        console.error(e);
    }
}


function escapeHtml(s){

    return String(s)
        .replace(
            /[&<>'"]/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"
            }[c])
        );
}


function openHistory(){

    const history =
        getHistory();

    if(!history.length){

        historyList.innerHTML =
            '<div class="empty">暂无历史起卦记录</div>';

    }else{

        historyList.innerHTML =
            history
            .map((x,i)=>`

                <div
                    class="history-item"
                    data-i="${i}"
                >

                    <div class="history-question">
                        ${escapeHtml(x.question)}
                    </div>

                    <div class="history-meta">

                        ${escapeHtml(x.time || "")}

                        <br>

                        本卦：
                        ${escapeHtml(x.ben)}

                        　

                        变卦：
                        ${escapeHtml(x.chg)}

                        <br>

                        六爻：
                        ${escapeHtml(
                            (x.yao || []).join("、")
                        )}

                        <br>

                        ${
                            x.moving &&
                            x.moving.length
                                ? "动爻：" +
                                  escapeHtml(
                                      x.moving.join("、")
                                  )
                                : "六爻皆静"
                        }

                    </div>

                    ${
                        x.answer
                            ? `
                                <div class="history-answer">
                                    <strong>AI解读：</strong><br>
                                    ${escapeHtml(x.answer)}
                                </div>
                              `
                            : `
                                <div class="history-answer">
                                    尚未进行 AI 解读
                                </div>
                              `
                    }

                </div>

            `)
            .join("");


        document
        .querySelectorAll(
            ".history-item"
        )
        .forEach(el=>{

            el.onclick = ()=>{

                loadHistory(
                    history[
                        +el.dataset.i
                    ]
                );

            };

        });
    }

    historyModal.classList.add("show");
}


function loadHistory(x){

    question =
        x.question;

    q.value =
        x.question;

    allYao =
        x.yao.slice();

    yaoIndex = 6;

    currentHistoryId =
        x.id || null;

    updateRows();

    bn.textContent =
        `本卦 · ${x.ben}`;

    cn.textContent =
        `变卦 · ${x.chg}`;

    renderHex(
        bh,
        allYao
    );

    renderHex(
        ch,
        allYao.map(v=>{

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        })
    );

    stageTitle.textContent =
        "历史卦象";

    stageDesc.textContent =
        "已载入历史记录，可以直接进行 GLM-5.2 AI 解读。";

    bar.style.width =
        "100%";

    ai.disabled =
        false;

    begin.disabled =
        false;

    isRunning = false;

    status.textContent =
        "历史卦象已载入。";

    answer.textContent =
        x.answer || "";

    historyModal.classList.remove(
        "show"
    );
}

/* =====================================================
   GLM API
===================================================== */

function sleep(ms){
    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}


/*
 * 判断是否值得重试。
 */
function shouldRetry(status,errorText){

    if(!status)
        return true;

    if(
        status === 408 ||
        status === 409 ||
        status === 429 ||
        status >= 500
    )
        return true;

    if(
        /timeout/i.test(errorText) ||
        /timed out/i.test(errorText) ||
        /network/i.test(errorText) ||
        /fetch/i.test(errorText)
    )
        return true;

    return false;
}


/*
 * 单次请求
 */
async function callGLM(
    apiKey,
    messages,
    signal
){

    const response =
        await fetch(
            "https://open.bigmodel.cn/api/paas/v4/chat/completions",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + apiKey

                },

                body:
                    JSON.stringify({

                        model:"glm-5.2",

                        messages,

                        temperature:.3,

                        max_tokens:3000,

                        stream:false

                    }),

                signal

            }
        );

    const raw =
        await response.text();

    let data;

    try{

        data =
            JSON.parse(raw);

    }catch(e){

        throw new Error(
            `HTTP ${response.status}：服务器返回格式异常`
        );
    }

    if(!response.ok){

        const msg =
            data?.error?.message ||
            data?.message ||
            data?.error?.msg ||
            `HTTP ${response.status}`;

        const error =
            new Error(
                String(msg)
            );

        error.status =
            response.status;

        throw error;
    }

    const text =
        data?.choices?.[0]
            ?.message
            ?.content;

    if(!text){

        throw new Error(
            "GLM 没有返回有效解读内容"
        );
    }

    return text;
}


/*
 * 带指数退避的稳定请求
 *
 * 第1次
 * 第2次
 * 第3次
 * 第4次
 *
 * 多标签页之间不会共享 AbortController，
 * 每个页面独立。
 */
async function requestGLMWithRetry(
    apiKey,
    messages
){

    const maxAttempts = 4;

    let lastError = null;

    for(
        let attempt = 1;
        attempt <= maxAttempts;
        attempt++
    ){

        const controller =
            new AbortController();

        /*
         * 每次请求45秒。
         */
        const timeout =
            setTimeout(
                ()=>{
                    controller.abort();
                },
                45000
            );

        try{

            const text =
                await callGLM(
                    apiKey,
                    messages,
                    controller.signal
                );

            clearTimeout(timeout);

            return text;

        }catch(e){

            clearTimeout(timeout);

            lastError = e;

            /*
             * 用户主动关闭/取消
             * 不继续重试。
             */
            if(
                e.name === "AbortError"
            ){

                lastError =
                    new Error(
                        "请求超过45秒，网络或 API 服务响应过慢。"
                    );
            }

            const retry =
                shouldRetry(
                    e.status,
                    e.message || ""
                );

            if(
                !retry ||
                attempt === maxAttempts
            ){

                break;
            }

            /*
             * 1.5s / 3s / 6s
             * 加一点随机抖动，
             * 减少多个网页同时重试造成的拥堵。
             */
            const delay =
                Math.min(
                    8000,
                    1500 *
                    Math.pow(
                        2,
                        attempt - 1
                    )
                )
                +
                Math.random()*800;

            status.textContent =
                `GLM 请求失败，第 ${attempt} 次重试中……`;

            answer.textContent =
                `正在重新连接 GLM……\n\n` +
                `第 ${attempt} 次请求未成功，` +
                `${Math.ceil(delay/1000)} 秒后自动重试。`;

            await sleep(delay);
        }
    }

    throw lastError ||
        new Error(
            "GLM 请求失败"
        );
}


/* =====================================================
   API错误翻译
===================================================== */

function explainAPIError(error){

    const text =
        String(
            error?.message || error || ""
        );

    const statusCode =
        error?.status || 0;

    if(
        statusCode === 401 ||
        /invalid.*api.?key/i.test(text) ||
        /api.?key.*invalid/i.test(text) ||
        /unauthorized/i.test(text) ||
        /authentication/i.test(text)
    ){

        return "智谱 API Key 无效或认证失败，请重新检查 API Key。";
    }

    if(
        statusCode === 403 ||
        /permission/i.test(text) ||
        /forbidden/i.test(text)
    ){

        return "当前 API Key 没有调用该模型的权限，请检查智谱账户权限。";
    }

    if(
        statusCode === 429 ||
        /rate.?limit/i.test(text) ||
        /too many/i.test(text)
    ){

        return "智谱 API 当前请求过于频繁，系统已经自动重试仍未成功，请稍后再试。";
    }

    if(
        /insufficient/i.test(text) ||
        /balance/i.test(text) ||
        /余额/i.test(text) ||
        /quota/i.test(text)
    ){

        return "智谱 API 余额或调用额度不足，请检查账户额度。";
    }

    if(
        /timeout/i.test(text) ||
        /timed out/i.test(text) ||
        /超过45秒/.test(text)
    ){

        return "GLM 请求超过45秒仍未完成，请检查网络或稍后重试。";
    }

    if(
        /failed to fetch/i.test(text) ||
        /network/i.test(text)
    ){

        return "浏览器无法连接智谱 API。请检查网络、浏览器跨域限制或 API 服务状态。";
    }

    if(
        statusCode >= 500
    ){

        return `智谱服务器暂时异常（HTTP ${statusCode}），系统已自动重试，请稍后再试。`;
    }

    return "GLM API 请求失败：" + text;
}


/* =====================================================
   AI解读
===================================================== */

async function requestAI(){

    const apiKey =
        localStorage.getItem(
            "wangxing_glm_key"
        );

    if(!apiKey){

        keyBox.style.display =
            "block";

        answer.textContent =
            "请先设置智谱 GLM-5.2 API Key。";

        return;
    }

    if(allYao.length !== 6){

        answer.textContent =
            "请先完成六爻起卦。";

        return;
    }

    const changed =
        allYao.map(v=>{

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        });

    const ben =
        hexName(allYao);

    const chg =
        hexName(changed);

    const moving =
        allYao
        .map((v,i)=>
            (
                v === 6 ||
                v === 9
            )
                ? `第${i+1}爻`
                : null
        )
        .filter(Boolean);


    const prompt = `

用户问题：

${question}

本卦：

${ben}

变卦：

${chg}

六爻：

${allYao.join("、")}

动爻：

${
    moving.length
        ? moving.join("、")
        : "无"
}


请严格围绕用户提出的问题进行六爻/大衍筮法解读。

要求：

1. 第一段直接回答用户的问题。

2. 明确说明结果偏向：
有利 / 不利 / 有条件成立 / 难以成立。

3. 结合本卦解释问题当前状态。

4. 有动爻时重点分析动爻，并说明动爻对该问题的影响。

5. 结合变卦判断最终趋势。

6. 如果卦象能够支持时间趋势，可以说明大致范围。

7. 只围绕用户实际提出的问题。

8. 不要泛泛给人生建议。

9. 不要主动扩展用户没有询问的问题。

10. 不要把占卜结果描述成百分之百确定的现实事实。

11. 如果用户询问的是：
“是否会发生”
“能不能”
“什么时候”
“有没有”
“是否存在”
等问题，必须直接针对该问题给出判断。

12. 不要用“建议你”“你可以考虑”“建议保持”等方式代替预测结论。

13. 解读重点必须放在卦象对用户问题的指向，而不是一般性人生建议。

14. 如果卦象无法支持精确判断，应明确说明“不足以精确判断”，但仍然给出最主要趋势。

15. 不要因为无法确定而只给建议。

16. 回答应该有：
【直接结论】
【卦象依据】
【动爻影响】
【最终趋势】
四个部分。

`;


    ai.disabled = true;

    ai.textContent =
        "正在解读……";

    answer.textContent =
        "正在连接 GLM-5.2……";

    status.textContent =
        "正在请求 GLM-5.2……";


    try{

        const text =
            await requestGLMWithRetry(
                apiKey,
                [

                    {
                        role:"system",

                        content:
                            "你是专业的传统大衍筮法与六爻解卦助手。严格围绕用户问题回答，优先给出明确预测结论，不主动给泛泛人生建议。"
                    },

                    {
                        role:"user",

                        content:prompt
                    }

                ]
            );


        answer.textContent =
            text;

        status.textContent =
            "GLM-5.2 AI 解读完成。";


        /*
         * 保存 AI 解读
         */
        if(currentHistoryId){

            updateHistoryAnswer(
                currentHistoryId,
                text
            );
        }


    }catch(e){

        const message =
            explainAPIError(e);

        answer.textContent =
            "解读失败：\n\n" +
            message;

        status.textContent =
            "GLM-5.2 AI 解读失败。";

    }finally{

        ai.disabled =
            false;

        ai.textContent =
            "✦ 解读";
    }
}


ai.onclick =
    requestAI;


/* =====================================================
   星空背景
===================================================== */

const stars =
    $("stars");

const ctx =
    stars.getContext("2d");

let ss = [];


function resize(){

    stars.width =
        innerWidth *
        devicePixelRatio;

    stars.height =
        innerHeight *
        devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    ss =
        Array.from(
            {
                length:
                    Math.floor(
                        innerWidth *
                        innerHeight /
                        9000
                    )
            },
            ()=>({

                x:
                    Math.random() *
                    innerWidth,

                y:
                    Math.random() *
                    innerHeight,

                r:
                    .2 +
                    Math.random() *
                    1.2,

                a:
                    .2 +
                    Math.random() *
                    .8

            })
        );
}


function draw(){

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    ss.forEach(s=>{

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(
                180,
                255,
                255,
                ${s.a}
            )`;

        ctx.fill();
    });

    requestAnimationFrame(
        draw
    );
}


addEventListener(
    "resize",
    resize
);

resize();

draw();

</script>
