<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WANGXING · 大衍筮法</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#01090c;
    color:#d9ffff;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}

body{
    overflow-x:hidden;
}

#stars{
    position:fixed;
    inset:0;
    z-index:0;
    background:#01090c;
}

.space{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
}

.nebula{
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(ellipse at 50% 10%,rgba(50,255,236,.38),transparent 24%),
        radial-gradient(ellipse at 15% 35%,rgba(0,180,220,.24),transparent 27%),
        radial-gradient(ellipse at 85% 45%,rgba(25,240,215,.20),transparent 25%),
        radial-gradient(ellipse at 45% 80%,rgba(0,120,180,.20),transparent 30%);
    filter:blur(20px);
    animation:drift 20s ease-in-out infinite alternate;
}

@keyframes drift{
    from{transform:scale(1)}
    to{transform:scale(1.08) translate(2%,-1%)}
}

.container{
    position:relative;
    z-index:2;
    max-width:1450px;
    margin:auto;
    padding:34px 42px 50px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:24px;
}

.logo{
    letter-spacing:.12em;
}

.en{
    font:32px Georgia,serif;
    color:#c1ffff;
}

.cn{
    font-size:29px;
    margin-top:5px;
}

.sub{
    margin-top:8px;
    font-size:12px;
    color:#689497;
}

.nav{
    display:flex;
    gap:28px;
    color:#78a7aa;
    font-size:12px;
}

.nav div{
    text-align:center;
    cursor:pointer;
}

.nav b{
    display:block;
    font-size:20px;
    font-weight:400;
    margin-bottom:4px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.panel{
    background:linear-gradient(
        145deg,
        rgba(3,29,35,.84),
        rgba(1,15,20,.78)
    );
    border:1px solid rgba(60,218,214,.42);
    border-radius:18px;
    box-shadow:
        0 0 35px rgba(23,203,202,.07),
        inset 0 0 30px rgba(67,240,233,.025);
    backdrop-filter:blur(10px);
}

.pad{
    padding:24px 28px;
}

h2{
    font-size:19px;
    font-weight:500;
    color:#aaf2ef;
    letter-spacing:.08em;
    margin:0 0 17px;
}

textarea{
    width:100%;
    height:108px;
    resize:none;
    outline:none;
    background:rgba(0,13,18,.72);
    border:1px solid #287b80;
    border-radius:11px;
    color:#d9ffff;
    padding:15px;
    font:15px "PingFang SC","Microsoft YaHei",sans-serif;
}

textarea:focus{
    border-color:#5be9e3;
    box-shadow:0 0 18px rgba(61,227,220,.13);
}

.actions{
    display:flex;
    gap:12px;
    margin-top:16px;
    flex-wrap:wrap;
}

.btn{
    border:1px solid #48d6d2;
    background:linear-gradient(180deg,#41c8c7,#169b9d);
    color:#efffff;
    border-radius:9px;
    padding:12px 20px;
    cursor:pointer;
    font:inherit;
    box-shadow:0 0 18px rgba(54,217,212,.14);
}

.btn.alt{
    background:transparent;
    color:#91babc;
    border-color:#286d72;
}

.btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.hint,
.status{
    font-size:12px;
    color:#638d90;
    line-height:1.8;
}

.stage{
    min-height:600px;
    margin-top:18px;
    padding:25px 22px;
}

.stage-title{
    text-align:center;
    color:#b2f5f1;
    font-size:19px;
    letter-spacing:.08em;
}

.stage-desc{
    text-align:center;
    color:#658f92;
    font-size:12px;
    line-height:1.8;
    min-height:43px;
    margin-top:7px;
}

.progress{
    height:5px;
    background:#08262a;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0;
}

.progress i{
    display:block;
    width:0;
    height:100%;
    background:#55dfda;
    box-shadow:0 0 12px #43e3dc;
    transition:.6s;
}

.pile-area{
    min-height:240px;
    margin:12px 0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.ritual{
    text-align:center;
    color:#c2ffff;
    font-size:16px;
    letter-spacing:.08em;
}

.ritual-sub{
    margin-top:8px;
    color:#638f92;
    font-size:11px;
    letter-spacing:.03em;
}

.single-stalk{
    width:5px;
    height:80px;
    margin:20px auto;
    border-radius:5px;
    background:linear-gradient(180deg,#efffff,#50d8d2);
    box-shadow:0 0 18px rgba(82,224,217,.65);
    animation:hang 1.2s ease forwards;
}

@keyframes hang{
    from{
        opacity:0;
        transform:translateY(-40px) rotate(-20deg);
    }
    to{
        opacity:1;
        transform:translateY(0) rotate(0);
    }
}

.pile-row{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.pile{
    min-height:220px;
    padding:17px;
    border:1px dashed #277276;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            ellipse,
            rgba(14,103,108,.23),
            rgba(0,25,30,.18) 60%,
            transparent 78%
        );
    transition:.3s;
}

.pile.clickable{
    cursor:pointer;
    border-color:#51dcd7;
    box-shadow:0 0 18px rgba(69,222,216,.10);
}

.pile.clickable:hover{
    transform:translateY(-3px);
    background:rgba(29,119,121,.20);
}

.pile-title{
    color:#8bbec0;
    font-size:13px;
    margin-bottom:9px;
}

.pile-number{
    font-size:26px;
    color:#c9ffff;
    margin-top:9px;
}

.pile-hint{
    color:#527f82;
    font-size:11px;
    margin-top:7px;
}

.stalk-visual{
    width:100%;
    max-width:270px;
    min-height:90px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:center;
    gap:3px;
    padding:10px;
    border-radius:12px;
    background:
        radial-gradient(
            ellipse,
            rgba(37,139,143,.17),
            rgba(1,23,28,.30)
        );
}

.stalk{
    width:3px;
    height:31px;
    display:block;
    border-radius:3px;
    background:linear-gradient(
        180deg,
        #dcffff,
        #52c9c5
    );
    opacity:.82;
    box-shadow:0 0 4px rgba(87,225,218,.35);
}

.process-box{
    width:100%;
    max-width:620px;
    margin:auto;
    border:1px solid #205c61;
    border-radius:13px;
    padding:18px;
    background:rgba(2,22,27,.65);
}

.process-title{
    text-align:center;
    color:#9dd6d7;
    font-size:13px;
    margin-bottom:14px;
}

.process-line{
    display:grid;
    grid-template-columns:1fr auto;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid #143b40;
    color:#719b9d;
    font-size:12px;
}

.process-line:last-child{
    border-bottom:0;
}

.process-line strong{
    color:#c8ffff;
    font-size:15px;
}

.choice{
    text-align:center;
    min-height:55px;
}

.choice-title{
    color:#7fa9ab;
    font-size:13px;
    margin-bottom:10px;
}

.choice-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.choice-btn{
    border:1px solid #317c80;
    background:#052329;
    color:#a7d8d9;
    border-radius:8px;
    padding:9px 15px;
    cursor:pointer;
}

.choice-btn:hover{
    border-color:#5be9e3;
    color:#dfffff;
}

.counts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:10px;
}

.countbox{
    border:1px solid #205a5f;
    border-radius:11px;
    padding:12px;
    text-align:center;
    color:#79a5a7;
}

.countbox strong{
    display:block;
    font-size:24px;
    color:#c5ffff;
    margin-top:5px;
}

.remainders{
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
    margin:13px 0;
}

.r{
    padding:8px 11px;
    border-radius:9px;
    background:#062329;
    border:1px solid #23686d;
    color:#8cb8ba;
}

.r b{
    color:#d4ffff;
}

.result{
    margin-top:15px;
    padding:16px;
    border:1px solid #245f64;
    border-radius:12px;
    background:rgba(1,22,27,.70);
    text-align:center;
}

.result .num{
    font-size:32px;
    color:#bafffa;
}

.result .name{
    font-size:15px;
    color:#7da9ab;
    margin-top:5px;
}

.hexwrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    margin-top:15px;
    text-align:center;
}

.hexname{
    color:#7ea9ab;
    font-size:13px;
    margin-bottom:11px;
}

.hex{
    display:flex;
    flex-direction:column;
    gap:7px;
    align-items:center;
}

.line{
    height:11px;
    width:150px;
    position:relative;
}

.solid,
.broken1,
.broken2{
    position:absolute;
    top:3px;
    height:6px;
    background:#5bdcd8;
    border-radius:5px;
    box-shadow:0 0 8px rgba(74,225,219,.2);
}

.solid{
    left:0;
    right:0;
}

.broken1{
    left:0;
    width:64px;
}

.broken2{
    right:0;
    width:64px;
}

.movingline .solid,
.movingline .broken1,
.movingline .broken2{
    background:#caffff;
}

.table{
    margin-top:18px;
    border:1px solid #20565b;
    border-radius:10px;
    overflow:hidden;
}

.tr{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    padding:9px 4px;
    border-bottom:1px solid #12383c;
    color:#789da0;
    font-size:12px;
    text-align:center;
}

.tr:last-child{
    border-bottom:0;
}

.tr.head{
    color:#94c1c2;
    background:rgba(30,101,105,.15);
}

.tr.move{
    background:rgba(59,205,201,.08);
    color:#c4eeee;
}

.api{
    margin-top:18px;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.apiBox{
    display:none;
    margin-top:8px;
}

.apiBox input{
    width:100%;
    background:#02161b;
    border:1px solid #28646a;
    border-radius:8px;
    color:white;
    padding:10px;
    outline:none;
}

.apiBox button{
    margin-top:8px;
}

#answer{
    white-space:pre-wrap;
    line-height:1.9;
    color:#c9eeee;
    min-height:80px;
    margin-top:15px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,8,12,.78);
    backdrop-filter:blur(8px);
    padding:30px;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-card{
    width:min(820px,100%);
    max-height:85vh;
    overflow:auto;
    background:#03171c;
    border:1px solid #3ed4d0;
    border-radius:18px;
    padding:24px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.history-item{
    border:1px solid #205a5f;
    border-radius:11px;
    padding:14px;
    margin:10px 0;
    cursor:pointer;
    background:rgba(3,31,37,.65);
}

.history-item:hover{
    border-color:#50ddd8;
}

.history-question{
    color:#c8ffff;
    margin-bottom:8px;
}

.history-meta{
    font-size:12px;
    color:#6f9da0;
    line-height:1.7;
}

.history-answer{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #143b40;
    color:#9dc8ca;
    line-height:1.8;
    white-space:pre-wrap;
}

.empty{
    color:#668f92;
    text-align:center;
    padding:30px;
}

.footer{
    text-align:center;
    color:#426b6e;
    font-size:11px;
    margin-top:22px;
}

@media(max-width:900px){

    .container{
        padding:22px 15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .nav{
        display:none;
    }
}

@media(max-width:560px){

    .hexwrap{
        grid-template-columns:1fr;
    }

    .pile-row{
        grid-template-columns:1fr;
    }

    .tr{
        font-size:11px;
    }

    .modal{
        padding:15px;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="space">
    <div class="nebula"></div>
</div>

<div class="container">

<header>

<div class="logo">
    <div class="en">WANGXING</div>
    <div class="cn">大衍筮法</div>
    <div class="sub">
        一问一卦 · 六爻成象 · 星河筮问
    </div>
</div>

<div class="nav">

    <div id="historyBtn">
        <b>◷</b>
        历史记录
    </div>

    <div id="settingsBtn">
        <b>⚙</b>
        设置
    </div>

</div>

</header>


<div class="grid">

<section>

<div class="panel pad">

<h2>你的问题</h2>

<textarea
id="q"
maxlength="500"
placeholder="请详细描述你想占卜的问题……"></textarea>

<div class="actions">

<button class="btn" id="begin">
    ✦ 开始大衍筮法
</button>

<button class="btn alt" id="restart">
    重新起卦
</button>

</div>

<p class="hint">
大衍之数五十，其用四十有九。
每一爻三变，六爻成卦。
过程中会真实展示分二、挂一、揲四、归奇。
</p>

</div>


<div class="panel stage">

<div class="stage-title" id="stageTitle">
准备大衍之数
</div>

<div class="stage-desc" id="stageDesc">
天地之数五十，虚一不用。
</div>

<div class="progress">
    <i id="bar"></i>
</div>

<div class="pile-area" id="piles"></div>

<div class="choice" id="choice"></div>

<div class="counts" id="counts"></div>

<div class="remainders" id="remainders"></div>

<div class="result" id="result" style="display:none"></div>

</div>

</section>


<section>

<div class="panel pad">

<h2>六爻结果</h2>

<div class="hexwrap">

<div>

<div class="hexname" id="bn">
本卦
</div>

<div class="hex" id="bh"></div>

</div>

<div>

<div class="hexname" id="cn">
变卦
</div>

<div class="hex" id="ch"></div>

</div>

</div>


<div class="table">

<div class="tr head">
<div>爻位</div>
<div>爻象</div>
<div>数值</div>
<div>状态</div>
</div>

<div id="rows"></div>

</div>


<div class="actions">

<button class="btn" id="ai" disabled>
✦ 解读
</button>

</div>

<div class="status" id="status">
完成六爻后才能进行 AI 解读。
</div>

<div id="answer"></div>

</div>


<div class="panel api">

<div>

<div>GLM-5.2 API</div>

<div class="status" id="keyStatus">
未设置
</div>

</div>

<button class="btn alt" id="keyButton">
设置
</button>

</div>


<div class="panel pad apiBox" id="keyBox">

<h2>GLM-5.2 API Key</h2>

<input
id="key"
type="password"
autocomplete="off"
placeholder="请输入智谱 API Key">

<button class="btn" id="saveKey">
保存设置
</button>

<button class="btn alt" id="clearKey">
清除 Key
</button>

</div>

</section>

</div>


<div class="footer">
WANGXING · 星河大衍筮法
</div>

</div>


<div class="modal" id="historyModal">

<div class="modal-card">

<div class="modal-head">

<h2 style="margin:0">
历史记录
</h2>

<button class="btn alt" id="closeHistory">
关闭
</button>

</div>

<div id="historyList"></div>

</div>

</div>


<script>

"use strict";

/* =====================================================
   DOM
===================================================== */

const $ = id => document.getElementById(id);

const q = $("q");
const begin = $("begin");
const restart = $("restart");

const piles = $("piles");
const choice = $("choice");
const counts = $("counts");
const remainders = $("remainders");
const result = $("result");

const stageTitle = $("stageTitle");
const stageDesc = $("stageDesc");
const bar = $("bar");

const bn = $("bn");
const cn = $("cn");
const bh = $("bh");
const ch = $("ch");

const rows = $("rows");

const ai = $("ai");
const answer = $("answer");
const status = $("status");

const keyBox = $("keyBox");
const key = $("key");
const keyStatus = $("keyStatus");

const historyModal = $("historyModal");
const historyList = $("historyList");


/* =====================================================
   八卦
=====================================================

   三爻顺序：

   初爻 → 二爻 → 三爻

   111 乾
   110 兑
   101 离
   100 震
   011 巽
   010 坎
   001 艮
   000 坤
===================================================== */

const tri = {

    "111":"乾",
    "110":"兑",
    "101":"离",
    "100":"震",
    "011":"巽",
    "010":"坎",
    "001":"艮",
    "000":"坤"

};


/* =====================================================
   六十四卦
===================================================== */

const hex = {

"乾乾":"乾为天",
"坤坤":"坤为地",
"坎震":"水雷屯",
"艮坎":"山水蒙",
"坎乾":"水天需",
"乾坎":"天水讼",
"坤坎":"地水师",
"坎坤":"水地比",
"巽乾":"风天小畜",
"乾兑":"天泽履",
"坤乾":"地天泰",
"乾坤":"天地否",
"乾离":"天火同人",
"离乾":"火天大有",
"坤艮":"地山谦",
"震坤":"雷地豫",
"兑震":"泽雷随",
"艮巽":"山风蛊",
"坤兑":"地泽临",
"巽坤":"风地观",
"离震":"火雷噬嗑",
"艮离":"山火贲",
"艮坤":"山地剥",
"坤震":"地雷复",
"乾震":"天雷无妄",
"艮乾":"山天大畜",
"艮震":"山雷颐",
"兑巽":"泽风大过",
"坎坎":"坎为水",
"离离":"离为火",
"兑艮":"泽山咸",
"震巽":"雷风恒",
"乾艮":"天山遁",
"震乾":"雷天大壮",
"离坤":"火地晋",
"坤离":"地火明夷",
"巽离":"风火家人",
"离兑":"火泽睽",
"坎艮":"水山蹇",
"震坎":"雷水解",
"艮兑":"山泽损",
"巽震":"风雷益",
"兑乾":"泽天夬",
"乾巽":"天风姤",
"兑坤":"泽地萃",
"坤巽":"地风升",
"兑坎":"泽水困",
"坎巽":"水风井",
"兑离":"泽火革",
"离巽":"火风鼎",
"震震":"震为雷",
"艮艮":"艮为山",
"巽艮":"风山渐",
"震兑":"雷泽归妹",
"震离":"雷火丰",
"离艮":"火山旅",
"巽巽":"巽为风",
"兑兑":"兑为泽",
"巽坎":"风水涣",
"坎兑":"水泽节",
"巽兑":"风泽中孚",
"震艮":"雷山小过",
"坎离":"水火既济",
"离坎":"火水未济"

};


/* =====================================================
   状态
===================================================== */

let question = "";

let yaoIndex = 0;

let changeIndex = 0;

/*
 * 每一爻开始时固定为49策
 */
let stalks = 49;

/*
 * 当前爻三变过程记录
 */
let changeRecords = [];

/*
 * 六爻：
 * 6 老阴
 * 7 少阳
 * 8 少阴
 * 9 老阳
 */
let allYao = [];


/* =====================================================
   工具
===================================================== */

function wait(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


/*
 * 揲四取余：
 *
 * 余1、2、3、4。
 * 余0按照4计。
 */
function remainder4(n){

    const r = n % 4;

    return r === 0 ? 4 : r;

}


/* =====================================================
   爻状态
===================================================== */

function yaoState(v){

    if(v === 6)
        return "老阴 · 动";

    if(v === 7)
        return "少阳 · 静";

    if(v === 8)
        return "少阴 · 静";

    if(v === 9)
        return "老阳 · 动";

    return "未知";

}


/* =====================================================
   六十四卦名称
===================================================== */

function hexName(lines){

    /*
     * lines[0] = 初爻
     * lines[1] = 二爻
     * lines[2] = 三爻
     * lines[3] = 四爻
     * lines[4] = 五爻
     * lines[5] = 上爻
     */

    const lower =
        lines
        .slice(0,3)
        .map(v =>
            (v === 7 || v === 9)
                ? "1"
                : "0"
        )
        .join("");

    const upper =
        lines
        .slice(3,6)
        .map(v =>
            (v === 7 || v === 9)
                ? "1"
                : "0"
        )
        .join("");

    const lowerName =
        tri[lower];

    const upperName =
        tri[upper];

    return (
        hex[upperName + lowerName]
        ||
        "未知卦"
    );

}

/* =====================================================
   揲四归奇
=====================================================

   核心算法：

   左束、右束分别四四分组。

   余数：
   1 / 2 / 3 / 4

   然后：

   挂一 + 左余 + 右余
   = 本变归奇数

   从49策中扣除归奇数。

   三变之后：

   24 / 28 / 32 / 36

   除以4：

   6 / 7 / 8 / 9
===================================================== */

async function performSuan(
    left,
    right
){

    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";


    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 第 ${changeIndex+1} 变`;

    stageDesc.textContent =
        "揲四：左右两束分别以四根为一组计数，余数归奇。";


    piles.innerHTML = `

        <div class="ritual">

            揲四

            <div class="ritual-sub">
                左右两束分别以四根为一组计数……
            </div>

        </div>

    `;


    await wait(1200);


    const leftRemainder =
        remainder4(left);

    const rightRemainder =
        remainder4(right);


    /*
     * 每一变必须减去：
     *
     * 挂一 1
     * 左余
     * 右余
     */
    const returned =
        1 +
        leftRemainder +
        rightRemainder;


    const before =
        stalks;

    const after =
        before -
        returned;


    /*
     * 安全校验
     */
    if(
        !Number.isInteger(after) ||
        after <= 0 ||
        after % 4 !== 0
    ){

        throw new Error(
            `大衍计算异常：本变前${before}策，归奇${returned}策，剩余${after}策。`
        );

    }


    stalks =
        after;


    changeIndex++;


    const record = {

        change:
            changeIndex,

        before,

        left,

        right,

        hanging:1,

        leftRemainder,

        rightRemainder,

        returned,

        after

    };


    changeRecords.push(record);


    piles.innerHTML = `

        <div class="process-box">

            <div class="process-title">
                揲四 · 归奇
            </div>

            <div class="process-line">
                <span>本变开始</span>
                <strong>${before} 蓍</strong>
            </div>

            <div class="process-line">
                <span>左束</span>
                <strong>${left} 蓍</strong>
            </div>

            <div class="process-line">
                <span>右束</span>
                <strong>${right} 蓍</strong>
            </div>

            <div class="process-line">
                <span>左束余数</span>
                <strong>${leftRemainder}</strong>
            </div>

            <div class="process-line">
                <span>右束余数</span>
                <strong>${rightRemainder}</strong>
            </div>

            <div class="process-line">
                <span>挂一</span>
                <strong>1</strong>
            </div>

            <div class="process-line">
                <span>本变归奇</span>
                <strong>${returned}</strong>
            </div>

            <div class="process-line">
                <span>本变之后</span>
                <strong>${after} 蓍</strong>
            </div>

        </div>

    `;


    counts.innerHTML = `

        <div class="countbox">

            左余

            <strong>
                ${leftRemainder}
            </strong>

        </div>

        <div class="countbox">

            右余

            <strong>
                ${rightRemainder}
            </strong>

        </div>

    `;


    remainders.innerHTML = `

        <div class="r">
            挂一 <b>1</b>
        </div>

        <div class="r">
            左余 <b>${leftRemainder}</b>
        </div>

        <div class="r">
            右余 <b>${rightRemainder}</b>
        </div>

        <div class="r">
            归奇 <b>${returned}</b>
        </div>

        <div class="r">
            余蓍 <b>${after}</b>
        </div>

    `;


    await wait(1300);


    if(changeIndex < 3){

        choice.innerHTML = `

            <div class="choice-title">
                第 ${changeIndex} 变完成，余 ${stalks} 蓍
            </div>

            <button
                class="choice-btn"
                id="nextChange"
            >
                进入第 ${changeIndex+1} 变
            </button>

        `;


        $("nextChange").onclick =
            () => {

                renderSplit();

            };


        return;

    }


    finishYao();

}


/* =====================================================
   三变成爻
===================================================== */

async function finishYao(){

    stageTitle.textContent =
        `第 ${yaoIndex+1} 爻 · 三变成爻`;

    stageDesc.textContent =
        "三变已毕，以最终余蓍数除以四，定其爻象。";


    const remaining =
        stalks;


    const value =
        remaining / 4;


    /*
     * 大衍筮法正确结果必须是：
     *
     * 24 / 4 = 6
     * 28 / 4 = 7
     * 32 / 4 = 8
     * 36 / 4 = 9
     */
    if(
        ![6,7,8,9].includes(value)
    ){

        alert(
            "本次大衍演算出现异常：" +
            "\n三变后余蓍：" +
            remaining +
            "\n最终除四：" +
            value +
            "\n请重新起卦。"
        );

        reset();

        return;

    }


    allYao.push(value);


    result.style.display =
        "block";


    result.innerHTML = `

            三变成爻

}


/* =====================================================
   六爻成卦
===================================================== */

function finishHexagram(){

    const original =
        allYao.slice();


    /*
     * 老阴6 → 阳7
     * 老阳9 → 阴8
     */
    const changed =
        allYao.map(v=>{

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        });


    const ben =
        hexName(original);

    const chg =
        hexName(changed);


    const moving =
        allYao
        .map((v,i)=>
            (
                v === 6 ||
                v === 9
            )
                ? `第${i+1}爻`
                : null
        )
        .filter(Boolean);


    bn.textContent =
        `本卦 · ${ben}`;

    cn.textContent =
        `变卦 · ${chg}`;


    renderHex(
        bh,
        original
    );

    renderHex(
        ch,
        changed
    );


    stageTitle.textContent =
        "六爻成象";

    stageDesc.textContent =
        "六爻全部完成，本卦、动爻与变卦已经形成。";


    bar.style.width =
        "100%";


    piles.innerHTML = `

        <div class="ritual">

            <div class="ritual-sub">
                本卦：${ben}
            </div>

            <div class="ritual-sub">

            </div>

            <div class="ritual-sub">

                ${
                    moving.length
                        ? "动爻：" +
                          moving.join("、")
                        : "六爻皆静"
                }

            </div>

        </div>

    `;


    choice.innerHTML = "";

    counts.innerHTML = "";

    remainders.innerHTML = "";


    result.style.display =
        "block";


    result.innerHTML = `

        <div class="num">
            ${ben}
        </div>

        <div class="name">
            六爻已成
        </div>

        <div class="process-box">

            <div class="process-line">

            </div>

            <div class="process-line">
                <span>变卦</span>

                <span>动爻</span>

                    ${
                        moving.length

    begin.disabled = false;

    ai.disabled = false;


    status.textContent =

/* =====================================================
   历史记录
===================================================== */

function getHistory(){

    try{

        const value =
            JSON.parse(
                localStorage.getItem(
                    "wangxing_history"
                ) || "[]"
            );

        return Array.isArray(value)
            ? value
            : [];

    }catch(e){

        return [];

    }

}


function saveHistory(item){

    let history =
        getHistory();


    /*
     * 如果同一个问题 + 同一组六爻已经存在，
     * 更新它，而不是无限重复新增。
     */
    const index =
        history.findIndex(x =>
            x.time === item.time
        );


    if(index >= 0){

        history[index] =
            {
                ...history[index],
                ...item
            };

    }else{

        history.unshift(item);

    }


    history =
        history.slice(0,30);


    try{

        localStorage.setItem(
            "wangxing_history",
            JSON.stringify(history)
        );

    }catch(e){

        console.error(
            "历史记录保存失败：",
            e
        );

    }

}


/*
 * 更新最近一次历史记录的AI解读
 */
function updateLatestHistoryAnswer(text){

    const history =
        getHistory();


    if(!history.length)
        return;


    history[0].answer =
        text;


    try{

        localStorage.setItem(
            "wangxing_history",
            JSON.stringify(
                history.slice(0,30)
            )
        );

    }catch(e){

        console.error(
            "历史解读保存失败：",
            e
        );

    }

}


function escapeHtml(s){

    return String(s ?? "")
        .replace(
            /[&<>'"]/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"

/* =====================================================
   API 错误分类
===================================================== */

function classifyApiError(
    statusCode,
    message
){

    const text =
        String(message || "");


    if(
        statusCode === 401 ||
        /invalid.*api.?key/i.test(text) ||
        /api.?key.*invalid/i.test(text) ||
        /unauthorized/i.test(text) ||
        /authentication/i.test(text)
    ){

        return {
            type:"key",
            retry:false,
            message:
                "智谱 API Key 无效或认证失败，请重新检查 API Key。"
        };

    }


    if(
        statusCode === 403 ||
        /permission/i.test(text) ||
        /forbidden/i.test(text)
    ){

        return {
            type:"permission",
            retry:false,
            message:
                "智谱 API Key 没有调用该模型的权限，请检查账户权限及模型权限。"
        };

    }


    if(
        statusCode === 429 ||
        /rate.?limit/i.test(text) ||
        /too many/i.test(text)
    ){

        return {
            type:"rate",
            retry:true,
            message:
                "请求过于频繁，正在自动重试。"
        };

    }


    if(
        /insufficient/i.test(text) ||
        /balance/i.test(text) ||
        /余额/i.test(text) ||
        /quota/i.test(text) ||
        /额度/i.test(text)
    ){

        return {
            type:"quota",
            retry:false,
            message:
                "智谱 API 余额或调用额度不足，请检查账户余额和模型额度。"
        };

    }


    if(
        statusCode === 404 ||
        (
            /model/i.test(text) &&
            (
                /not found/i.test(text) ||
                /不存在/.test(text)
            )
        )
    ){

        return {
            type:"model",
            retry:false,
            message:
                "GLM-5.2 模型不可用，请检查智谱账户是否支持该模型。"
        };

    }


    if(
        statusCode >= 500 &&
        statusCode <= 599
    ){

        return {
            type:"server",
            retry:true,
            message:
                "智谱服务器暂时异常，正在自动重试。"
        };

    }


    return {
        type:"unknown",
        retry:false,
        message:
            "智谱 API 请求失败：" +
            (
                text ||
                `HTTP ${statusCode || "未知"}`
            )
    };

}


/* =====================================================
   单次 API 请求
===================================================== */

async function requestGLMOnce(
    apiKey,
    prompt,
    signal
){

    const response =
        await fetch(
            "https://open.bigmodel.cn/api/paas/v4/chat/completions",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " +
                        apiKey

                },

                body:
                    JSON.stringify({

                        model:
                            "glm-5.2",

                        messages:[

                            {

                                role:"system",

                                content:
                                    "你是专业的传统大衍筮法与六爻解卦助手。严格围绕用户问题回答，优先给出明确预测结论，不主动提供泛泛人生建议。"

                            },

                            {

                                role:"user",

                                content:
                                    prompt

                            }

                        ],

                        temperature:.3,

                        max_tokens:3000,

                        stream:false

                    }),

                signal

            }

        );


    const raw =
        await response.text();


    let data = null;


    try{

        data =
            raw
                ? JSON.parse(raw)
                : null;

    }catch(e){

        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}：${raw.slice(0,300)}`
            );

        }

        throw new Error(
            "GLM 返回的数据格式异常。"
        );

    }


    if(!response.ok){

        const msg =
            data?.error?.message ||
            data?.error?.msg ||
            data?.message ||
            raw ||
            `HTTP ${response.status}`;


        const info =
            classifyApiError(
                response.status,
                msg
            );


        const error =
            new Error(info.message);

        error.retry =
            info.retry;

        error.type =
            info.type;

        error.status =
            response.status;

        throw error;

    }


    const text =
        data?.choices?.[0]
            ?.message
            ?.content;


    if(!text){

        const error =
            new Error(
                "GLM-5.2 没有返回解读内容。"
            );

        error.retry = true;

        throw error;

    }


    return text;

}


/* =====================================================
   GLM 稳定重试
===================================================== */

async function requestGLMWithRetry(
    apiKey,
    prompt
){

    /*
     * 最多4次。
     *
     * 1
     * 2
     * 4
     * 8
     *
     * 这样网络偶发失败不会立即显示 Failed to fetch。
     */
    const maxAttempts = 4;

    let lastError = null;


    for(
        let attempt = 1;
        attempt <= maxAttempts;
        attempt++
    ){

        const controller =
            new AbortController();


        /*
         * 每一次单独30秒。
         */
        const timer =
            setTimeout(
                ()=>{
                    controller.abort();
                },
                30000
            );


        try{

            if(attempt > 1){

                status.textContent =
                    `第 ${attempt}/${maxAttempts} 次尝试连接 GLM-5.2……`;

                answer.textContent =
                    `首次请求未成功，正在进行第 ${attempt} 次重试……`;

            }


            const text =
                await requestGLMOnce(
                    apiKey,
                    prompt,
                    controller.signal
                );


            return text;

        }catch(e){

            lastError = e;


            if(
                e.name === "AbortError"
            ){

                lastError =
                    new Error(
                        "请求超过30秒，网络响应超时。"
                    );

                lastError.retry = true;

            }


            /*
             * 明确不可重试错误：
             *
             * Key
             * 权限
             * 余额
             * 模型
             *
             * 直接结束。
             */
            if(
                lastError.retry === false
            ){

                throw lastError;

            }


            /*
             * 已经最后一次。
             */
            if(
                attempt >= maxAttempts
            ){

                throw lastError;

            }


            /*
             * 指数退避：
             *
             * 1.5秒
             * 3秒
             * 6秒
             */
            const delay =
                1500 *
                Math.pow(
                    2,
                    attempt - 1
                );


            status.textContent =
                `请求暂时失败，${Math.round(delay/1000)} 秒后自动重试……`;


            await wait(delay);

        }finally{

            clearTimeout(timer);

        }

    }


    throw (
        lastError ||
        new Error(
            "GLM 请求失败。"
        )
    );

}


/* =====================================================
   构造 AI Prompt
===================================================== */

function buildPrompt(){

    const changed =
        allYao.map(v=>{

            if(v === 6)
                return 7;

            if(v === 9)
                return 8;

            return v;

        });


    const ben =
        hexName(allYao);

    const chg =
        hexName(changed);


    const moving =
        allYao
        .map((v,i)=>
            (
                v === 6 ||
                v === 9
            )
                ? `第${i+1}爻`
                : null
        )
        .filter(Boolean);


    return `

用户问题：

${question}


本卦：

${ben}


变卦：

${chg}


六爻：

${allYao.join("、")}


六爻状态：

${allYao.map(yaoState).join("；")}


动爻：

${
    moving.length
        ? moving.join("、")
        : "无"
}


请严格围绕用户提出的问题进行六爻 / 大衍筮法解读。

【最重要要求】

第一，直接回答用户的问题。

如果用户问：
“会不会发生”
“能不能”
“有没有”
“是否存在”
“什么时候”
“能否获得”
“会不会成功”

必须直接针对这个问题给出判断。

不要先讲一大堆六爻基础知识。


【结论】

开头直接给出：

结果偏向：
有利 / 不利 / 有条件成立 / 难以成立 / 不足以判断

然后用一句话明确回答用户的问题。


【卦象】

结合本卦说明目前局势。

【动爻】

如果有动爻，重点分析动爻对用户问题的影响。

如果没有动爻，说明静卦对该问题的指向。


【变卦】

结合变卦判断最终趋势。


【时间】

只有在卦象确实能够支持时间趋势时才判断大致时间范围。

不要为了完整而强行编造日期。


【严格限制】

1. 只回答用户实际提出的问题。

2. 不要泛泛扩展到事业、感情、健康、财运等用户没有询问的领域。

3. 不要主动给人生建议。

4. 不要用“建议你”“你可以考虑”“保持耐心”等建议替代预测。

5. 不要把占卜结果描述为百分之百确定的现实事实。

6. 如果卦象证据不足以精确判断，要明确说“不足以判断”，但仍然给出最主要趋势。

7. 不要回避问题。

8. 不要只解释卦名而不回答用户问题。

9. 用户如果询问的是未来事件，重点必须放在“是否发生、趋势如何、结果如何、时间如何”。

10. 结论必须优先于解释。

`;

}

async function requestAI(){

    const apiKey =
        localStorage.getItem(
            "wangxing_glm_key"

        answer.textContent =

        return;

    }


    if(allYao.length !== 6){

        answer.textContent =
            "请先完成六爻起卦。";

        return;

    }


    const prompt =
        buildPrompt();


    ai.disabled =
        true;

    ai.textContent =
        "正在解读……";

    answer.textContent =
        "正在连接 GLM-5.2……";

    status.textContent =
        "正在连接 GLM-5.2……";


    try{

        const text =
            await requestGLMWithRetry(
                apiKey,
                prompt
            );


        answer.textContent =
            text;


        status.textContent =
            "GLM-5.2 AI 解读完成。";


        /*

         */
        updateLatestHistoryAnswer(
            text
        );


    }catch(e){

        console.error(
            "GLM API Error:",
            e
        );


        if(
            e.name === "AbortError"
        ){

            answer.textContent =
                "解读失败：请求超时，已经自动重试多次，请检查网络后再次点击“解读”。";

        }else{

            answer.textContent =
                "解读失败：" +
                (
                    e.message ||
                    "未知错误"
                );

        }


        status.textContent =
            "GLM-5.2 AI 解读失败，可重新点击“解读”。";


    }finally{

        ai.disabled =
            false;

        ai.textContent =
            "✦ 解读";

    }

}

/* =====================================================
   星空背景
===================================================== */

const stars =
    $("stars");

const ctx =
    stars.getContext("2d");

let ss = [];


function resize(){

    stars.width =
        innerWidth *
        devicePixelRatio;

    stars.height =
        innerHeight *
        devicePixelRatio;


    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );


    ss =
        Array.from(
            {
                length:
                    Math.floor(
                        innerWidth *
                        innerHeight /
                        9000
                    )
            },
            ()=>({

                x:
                    Math.random() *
                    innerWidth,

                y:
                    Math.random() *
                    innerHeight,

                r:
                    .2 +
                    Math.random() *
                    1.2,

                a:
                    .2 +
                    Math.random() *
                    .8

            })
        );

}


function draw(){

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );


    ss.forEach(s=>{

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            `rgba(
                180,
                255,
                255,
                ${s.a}
            )`;


        ctx.fill();

    });


    requestAnimationFrame(
        draw
    );

}


addEventListener(
    "resize",
    resize
);

resize();

draw();


/* =====================================================
   全局异常保护
=====================================================

   如果某个异步过程出现异常，
   不让整个页面直接白屏。
===================================================== */

window.addEventListener(
    "unhandledrejection",
    event => {

        console.error(
            "Unhandled Promise:",
            event.reason
        );

        if(
            answer &&
            !answer.textContent
        ){

            answer.textContent =
                "操作过程中出现异常，请点击“重新起卦”后重试。";

        }

    }
);
